---
name: Trivy (dependency scan)

# Scans the frontend's npm dependency tree (src/ui/pnpm-lock.yaml) for known CVEs.
# govulncheck already covers Go (reachability-aware), so this closes the gap for the
# UI's dependencies. Trivy is baked into the homelab-runner image (ARG TRIVY_VERSION) —
# no per-run binary download; the vulnerability DB is cached on the runner PVC
# (/data/.cache/trivy), so it's fetched once and reused (Trivy's 24h TTL refreshes it).
on:
  push:
    branches: ["**"]
    paths:
      - "src/ui/pnpm-lock.yaml"
      - "src/ui/package.json"
      - ".trivyignore.yaml"
      - ".gitea/workflows/trivy.yml"
  # Weekly sweep so a CVE disclosed against UNCHANGED deps is caught here instead of
  # waiting for the next lockfile edit. Tue 04:17 UTC — spread off go-lint (Fri 03:00).
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan UI dependencies
        # `trivy fs src/ui` reads pnpm-lock.yaml directly — no `pnpm install` needed.
        #   --scanners vuln     : CVEs only (gitleaks owns secret scanning).
        #   --include-dev-deps  : scan the WHOLE dependency tree. The UI's deps are
        #                         mostly devDependencies (vite/svelte/playwright/vitest/…);
        #                         without this, Trivy scans only the handful of runtime
        #                         deps and silently skips the bulk of the tree.
        #   --ignore-unfixed    : only flag vulns that HAVE a fix, so a failure is always
        #                         actionable (bump the dep — Renovate opens the PR).
        #   --cache-dir on the PVC persists the DB across pod restarts (downloaded once,
        #                         shared with the homelab Trivy runs on the same runner).
        #   --skip-java-db-update: no JARs here; skips the ~200MB Java DB.
        #   --ignorefile: accepted CVEs (with reason + expiry) live in .trivyignore.yaml.
        #   --format table + --exit-code 1: print findings straight to the log and fail on
        #                     one. (The old json + `trivy convert` combo emitted a confusing
        #                     "No enabled scanners found" warning on clean runs.)
        timeout-minutes: 15
        run: |
          trivy fs \
            --scanners vuln \
            --include-dev-deps \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --cache-dir /data/.cache/trivy \
            --skip-java-db-update \
            --timeout 10m \
            --format table \
            src/ui
          echo "UI dependencies clean — no fixable CRITICAL/HIGH CVEs"

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh

  scan-images:
    name: Trivy scan release images
    # Post-build CVE drift: release.yml scans images at BUILD time (CVEs known then).
    # This re-scans the latest released images weekly, so a newly-disclosed CVE against
    # an already-shipped image surfaces here. Schedule/dispatch only — needs the images
    # to already exist in the registry.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags — to find the latest release

      - name: Log in to Gitea registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"gitea-http.gitea.svc.cluster.local:3000":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 -w 0)" \
            > ~/.docker/config.json

      - name: Scan latest release images
        timeout-minutes: 30
        run: |
          TAG="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$TAG" ]; then echo "no stable release tag yet — nothing to scan"; exit 0; fi
          REG="gitea-http.gitea.svc.cluster.local:3000"
          echo "Scanning release ${TAG}"
          FAILED=0
          for app in api ui; do
            IMG="${REG}/${IMAGE_OWNER}/iron-temple-${app}:${TAG}"
            echo ""; echo "=== ${IMG} ==="
            trivy image --insecure --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
              --ignore-unfixed --ignorefile .trivyignore.yaml \
              --cache-dir /data/.cache/trivy --skip-java-db-update --timeout 15m \
              --format table "${IMG}" || FAILED=1
          done
          [ "$FAILED" -ne 0 ] && { echo "FAIL: CRITICAL/HIGH CVEs in a release image (${TAG})"; exit 1; }
          echo "Release ${TAG} images clean — no fixable CRITICAL/HIGH CVEs"

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
