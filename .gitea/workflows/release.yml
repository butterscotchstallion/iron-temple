---
name: Release — build & push images

# Tagging a release (vX.Y.Z) builds + pushes the API and UI container images to
# the Gitea registry, then Trivy-scans each (fail on CRITICAL/HIGH). The resulting
# <tag>@<digest> refs are printed to the job summary for pinning in homelab-gitops
# (services/iron-temple/*).
#
# AUTH — pushes with a stored REGISTRY_TOKEN secret. We tried Gitea's built-in
# per-run token (secrets.GITHUB_TOKEN); this instance's registry rejects it
# ("failed to fetch oauth token: unauthorized"), so a stored credential is
# required. Prefer a dedicated NON-ADMIN package bot's token over an admin token.
# Configure per repo:
#   secret REGISTRY_TOKEN — the bot's (or reused) write:package token   [required]
#   var    REGISTRY_USER  — the token owner's username (defaults to the tagger)   [bot only]
#   var    IMAGE_OWNER    — registry namespace to push under (defaults to the repo owner) [bot only]
# Also needs buildkitd egress to an npm registry for the UI stage — the API stage
# is vendored and builds offline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, push, scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: src/api
            dockerfile: src/api
          # The UI build context is the repo ROOT: the typed API client is
          # generated from ../api/openapi.yaml at build time, so the spec must be
          # in context. Its Dockerfile lives in src/ui.
          - app: ui
            context: .
            dockerfile: src/ui
    env:
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Log in to Gitea registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"gitea-http.gitea.svc.cluster.local:3000":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_TOKEN}" | base64 -w 0)" \
            > ~/.docker/config.json

      - name: Build and push
        id: build
        # BuildKit registry cache (buildcache tag) survives pod restarts; --import-cache
        # silently no-ops on the first run when the tag doesn't exist yet.
        run: |
          TAG="${{ github.ref_name }}"
          REPO="gitea-http.gitea.svc.cluster.local:3000/${IMAGE_OWNER}/iron-temple-${{ matrix.app }}"
          IMAGE="${REPO}:${TAG}"
          CACHE_REF="${REPO}:buildcache"
          buildctl \
            --addr tcp://buildkitd.gitea.svc.cluster.local:1234 \
            build \
            --frontend dockerfile.v0 \
            --local context=${{ matrix.context }} \
            --local dockerfile=${{ matrix.dockerfile }} \
            --import-cache type=registry,ref=${CACHE_REF},registry.insecure=true \
            --export-cache type=registry,ref=${CACHE_REF},mode=max,registry.insecure=true \
            --output "type=image,name=${IMAGE},push=true,registry.insecure=true" \
            --metadata-file /tmp/meta-${{ matrix.app }}.json
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/meta-${{ matrix.app }}.json)"
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "error: buildctl produced no digest" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"

      - name: Scan (Trivy — fail on CRITICAL/HIGH)
        timeout-minutes: 20
        run: |
          IMAGE="gitea-http.gitea.svc.cluster.local:3000/${IMAGE_OWNER}/iron-temple-${{ matrix.app }}:${{ github.ref_name }}"
          trivy image \
            --insecure \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --timeout 15m \
            "${IMAGE}"

      - name: Pin ref (job summary)
        run: |
          PIN="192.168.3.10:3000/${IMAGE_OWNER}/iron-temple-${{ matrix.app }}:${{ github.ref_name }}@${{ steps.build.outputs.digest }}"
          {
            echo "### iron-temple-${{ matrix.app }}"
            echo "Pin this in homelab-gitops (services/iron-temple/):"
            echo '```'
            echo "${PIN}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
