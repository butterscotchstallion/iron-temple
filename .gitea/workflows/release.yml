---
name: Release — auto-version, build, deploy

# On every push to main: compute the next SemVer from Conventional Commits since
# the last stable tag (scripts/next-version.sh). If something releasable landed
# (feat/fix/breaking), build+scan+push the API and UI images at that version, tag
# it, and open a repin PR on homelab-gitops. Only chore/docs/etc. → no release.
# workflow_dispatch with a `version` input forces a specific release.
#
# Secrets / vars:
#   REGISTRY_TOKEN (secret) + REGISTRY_USER / IMAGE_OWNER (vars)
#       — push images to the Gitea registry (iron-temple-ci bot, write:package).
#   GITOPS_TOKEN   (secret) — write:repository on homelab-gitops
#       (non-admin iron-temple-deployer bot) — opens the deploy PR. PR-gated.
# Also needs buildkitd egress to an npm registry for the UI stage.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Force a version (e.g. 0.1.0); blank = auto-compute"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the git tag
    env:
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}
      REG: gitea-http.gitea.svc.cluster.local:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags + full history for the version compute

      - name: Compute version
        id: ver
        # INPUT_VERSION via env, never inlined into the script — a dispatch value
        # is untrusted input (command-injection surface).
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          [ -z "$V" ] && V="$(scripts/next-version.sh)"
          if [ -z "$V" ]; then
            echo "No releasable commits since the last stable tag — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$V"     >> "$GITHUB_OUTPUT"
            echo "Releasing v$V"
          fi

      - name: Log in to Gitea registry
        if: steps.ver.outputs.release == 'true'
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REG" \
            "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 -w 0)" \
            > ~/.docker/config.json

      - name: Build, push, scan — API
        if: steps.ver.outputs.release == 'true'
        id: api
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          IMG="$REG/${IMAGE_OWNER}/iron-temple-api"
          buildctl --addr tcp://buildkitd.gitea.svc.cluster.local:1234 build \
            --opt build-arg:VERSION="${TAG}" \
            --frontend dockerfile.v0 --local context=src/api --local dockerfile=src/api \
            --import-cache type=registry,ref=${IMG}:buildcache,registry.insecure=true \
            --export-cache type=registry,ref=${IMG}:buildcache,mode=max,registry.insecure=true \
            --output "type=image,name=${IMG}:${TAG},push=true,registry.insecure=true" \
            --metadata-file /tmp/api.json
          D="$(jq -r '."containerimage.digest"' /tmp/api.json)"
          [ -n "$D" ] && [ "$D" != null ] || { echo "no digest"; exit 1; }
          trivy image --insecure --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --ignorefile .trivyignore.yaml --timeout 15m "${IMG}:${TAG}"
          echo "ref=192.168.3.10:3000/${IMAGE_OWNER}/iron-temple-api:${TAG}@${D}" >> "$GITHUB_OUTPUT"

      - name: Build, push, scan — UI
        if: steps.ver.outputs.release == 'true'
        id: ui
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          IMG="$REG/${IMAGE_OWNER}/iron-temple-ui"
          buildctl --addr tcp://buildkitd.gitea.svc.cluster.local:1234 build \
            --frontend dockerfile.v0 --local context=. --local dockerfile=src/ui \
            --import-cache type=registry,ref=${IMG}:buildcache,registry.insecure=true \
            --export-cache type=registry,ref=${IMG}:buildcache,mode=max,registry.insecure=true \
            --output "type=image,name=${IMG}:${TAG},push=true,registry.insecure=true" \
            --metadata-file /tmp/ui.json
          D="$(jq -r '."containerimage.digest"' /tmp/ui.json)"
          [ -n "$D" ] && [ "$D" != null ] || { echo "no digest"; exit 1; }
          trivy image --insecure --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --ignorefile .trivyignore.yaml --timeout 15m "${IMG}:${TAG}"
          echo "ref=192.168.3.10:3000/${IMAGE_OWNER}/iron-temple-ui:${TAG}@${D}" >> "$GITHUB_OUTPUT"

      - name: Compute changelog
        if: steps.ver.outputs.release == 'true'
        # BEFORE the tag is created, so changelog.sh's "last stable tag" is the
        # PREVIOUS release and the range (prev..HEAD) captures this release's commits.
        run: scripts/changelog.sh > /tmp/notes.md

      - name: Tag the release
        if: steps.ver.outputs.release == 'true'
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Release notes (Gitea Release)
        if: steps.ver.outputs.release == 'true'
        # Truly best-effort: never fail the release (or skip the deploy PR below)
        # over release notes — even on a curl transport error.
        continue-on-error: true
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          code="$(jq -n --arg t "$TAG" --rawfile b /tmp/notes.md \
                    '{tag_name:$t, target_commitish:"main", name:$t, body:$b}' \
                  | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                      -H "Authorization: token ${RELEASE_TOKEN}" \
                      -H "Content-Type: application/json" --data @- \
                      "http://gitea-http.gitea.svc.cluster.local:3000/api/v1/repos/${{ github.repository }}/releases" || echo 000)"
          echo "Release API -> HTTP ${code}"
          [ "${code}" -ge 400 ] && echo "warning: could not create Release (continuing)" || true

      - name: Open deploy PR on homelab-gitops
        if: steps.ver.outputs.release == 'true'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          scripts/open-deploy-pr.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ steps.api.outputs.ref }}" \
            "${{ steps.ui.outputs.ref }}"

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
