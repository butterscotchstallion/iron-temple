---
name: Go Lint & Test

# Backend CI for src/api (Go + chi). Mirrors the homelab-gitops go-lint.yml job
# set — go.mod tidy check, vet, golangci-lint, govulncheck, gosec, test+coverage —
# adapted for this repo: a single vendored module, and `go test -short` because the
# integration tests use Testcontainers (no container runtime on the host executor).
#
# Required-status-check safety: this workflow always triggers on every branch push
# (NO `on.paths` filter) so its `result` gate always reports a commit status. Branch
# protection can then require the "Go Lint & Test" context without deadlocking a PR
# that doesn't touch src/api. Path filtering lives in the `changes` job, so the heavy
# lint/test/integration jobs still only run when backend-relevant files change.
# See docs/ci-branch-protection.md.
on:
  push:
    branches: ["**"]
  # Weekly sweep: govulncheck re-checks the modules + toolchain stdlib against the
  # live vuln DB, so a CVE disclosed against UNCHANGED code is caught here instead
  # of waiting for the next edit. Fri 03:00 UTC (spreads load off the homelab-gitops
  # schedules: Kubescape Mon, Trivy Wed, DAST Thu).
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: did anything backend-relevant change on this push? Drives whether the
  # heavy jobs run. Always runs so the workflow's status context is produced even when
  # nothing relevant changed. Non-push events (schedule, dispatch) always run everything.
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Relevance is computed BRANCH-vs-main, not push-vs-previous-push. A per-push
      # diff plus a gate that counts `skipped` as a pass lets a path-irrelevant
      # follow-up commit wash out an earlier failure — see the script's header for
      # the incident this prevents.
      - name: Detect relevant changes
        id: detect
        # Context values go through env, NOT ${{ }} interpolation into the script.
        # ${{ }} is substituted textually before the shell parses the line, and git
        # permits $ ` ( ) ; in ref names — a branch named `$(cmd)` would execute on
        # the runner. Via env the value is just a string in a variable.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          relevant=$(bash "$GITHUB_WORKSPACE/.gitea/scripts/detect-relevant-changes" \
            "$EVENT_NAME" "$REF_NAME" "$HEAD_SHA" "$BEFORE_SHA" \
            '^(src/api/|\.gitea/workflows/go\.yml$|\.gitea/scripts/|\.gitea/ci/postgres\.yaml$)')
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  go:
    name: Go Build & Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    env:
      # Go toolchain + golangci-lint + govulncheck are baked into the homelab-runner
      # image (/usr/local/go, /usr/local/bin) — no per-run downloads. gosec is the one
      # exception: since v2.28.0 its graph pulls in the large openai-go SDK, which OOMs
      # the runner if compiled, so we fetch its prebuilt (sha256-verified) binary and
      # cache it. GOSEC_VERSION is its single source of truth.
      GOSEC_VERSION: v2.28.0
      # Pin the baked toolchain; never silently fetch a newer one. go.mod says `go 1.26`
      # and the image bakes 1.26.x — a module needing newer Go fails loudly (rebuild the
      # runner image) rather than downloading a toolchain at run time.
      GOTOOLCHAIN: local
      # Per-job module cache, outside the shared home directory.
      #
      # The host-executor pod reuses ~/go/pkg/mod between jobs, and a run of broken
      # cache restores left that tree with modules present at the right version but no
      # source in them. `go mod tidy` reported "module …@latest found (v5.3.1), but
      # does not contain package …" and rewrote go.mod — and kept doing it after the
      # restore was removed, because the damage was already on disk.
      #
      # A fresh path per job cannot inherit that, and unlike deleting the shared cache
      # it cannot pull the tree out from under a job running concurrently on the same
      # pod. RUNNER_TEMP is job-scoped, so it is also cleaned up for us.
      #
      # Cheap here: this module is vendored, so only the `go mod tidy` check reads the
      # module cache at all — everything else builds from vendor/.
      GOMODCACHE: ${{ runner.temp }}/gomodcache
      # Runner drops ALL caps (no CAP_CHOWN) → tar can't chown on a cache-cold restore.
      # GNU tar honours TAR_OPTIONS; skip the chown.
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Merging the base branch needs its commits present.
          fetch-depth: 0

      # Run the gates against the tree that will exist on main once this branch
      # merges, not the branch in isolation — two individually-green branches can
      # still merge into a tree that doesn't compile. See the script header for
      # the incident (#72 x #73) this prevents.
      # Context goes through env, not ${{ }} — see the note in the changes job.
      - name: Merge main into the head under test
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash "$GITHUB_WORKSPACE/.gitea/scripts/merge-base-branch" "$EVENT_NAME" "$REF_NAME"

      # Use the Go toolchain baked into the runner image instead of actions/setup-go
      # (no download). GOTOOLCHAIN=local pins it.
      - name: Use the baked Go toolchain
        run: |
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          # GOPATH/bin holds the cached gosec binary.
          echo "$(/usr/local/go/bin/go env GOPATH)/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      # On a reused host-executor pod, files from a previous job linger read-only, so
      # tar fails on cache restore. Make them writable. Now only covers the build
      # cache: the module cache is no longer restored at all (see below).
      - name: Prepare Go cache dirs
        run: chmod -R u+w ~/.cache/go-build 2>/dev/null || true

      # Cache the BUILD cache only — not ~/go/pkg/mod.
      #
      # This module is vendored, so go vet, golangci-lint, gosec and go test all read
      # vendor/ and never consult the module cache. The only step that wants it is the
      # `go mod tidy` check, which re-resolves over the network by definition. So
      # ~/go/pkg/mod was ~2.4 GB of archive bought almost nothing — and it was the one
      # thing breaking these jobs.
      #
      # How it broke: on a reused host-executor pod the module cache from a previous
      # job is still on disk, and Go writes it read-only. Restoring the archive over
      # that tree failed ~15,700 times with "Cannot open/mkdir: Permission denied", so
      # modules ended up present at the right version with no source inside them.
      # `go mod tidy` then reported "module …@latest found (v5.3.1), but does not
      # contain package …", re-resolved everything, rewrote go.mod, and failed the
      # tidiness check — on a go.mod byte-identical to main's. The "Prepare Go cache
      # dirs" chmod above did not help, because it targets the job container's HOME
      # while the archive lands in the host executor's tree.
      #
      # go2- prefix: the old entries hold ~/go/pkg/mod and would still be restored
      # through the restore-keys fallback. Both key and restore-keys have to move, or
      # the poisoned archive is still reachable. They age out on their own.
      - name: Cache Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go2-${{ runner.os }}-${{ hashFiles('src/api/go.sum') }}
          restore-keys: go2-${{ runner.os }}-

      # Cache gosec's prebuilt binary across runs — only re-downloaded when GOSEC_VERSION bumps.
      - name: Cache gosec
        id: cache-gosec
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/gosec
          key: gosec-${{ env.GOSEC_VERSION }}-${{ runner.os }}

      # Download gosec's prebuilt release binary (sha256-verified against the published
      # checksums) instead of `go install`, which would compile its whole dep graph
      # (incl. the large openai-go SDK) and OOM the runner. Skipped entirely on cache hit.
      - name: Install gosec
        if: steps.cache-gosec.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ver="${GOSEC_VERSION#v}"
          bindir="$(go env GOPATH)/bin"
          base="https://github.com/securego/gosec/releases/download/${GOSEC_VERSION}"
          asset="gosec_${ver}_linux_amd64.tar.gz"
          mkdir -p "$bindir"
          curl -sSfL --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 5 \
            -o /tmp/gosec.tar.gz "${base}/${asset}"
          # goreleaser's checksum filename varies by config version — try the versioned
          # name, then the generic one. Fail loudly if neither yields our asset's hash.
          curl -sSfL --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 5 \
            -o /tmp/gosec_checksums.txt "${base}/gosec_${ver}_checksums.txt" \
            || curl -sSfL --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 5 \
                 -o /tmp/gosec_checksums.txt "${base}/checksums.txt"
          expected=$(grep "${asset}$" /tmp/gosec_checksums.txt | awk '{print $1}')
          if [ -z "$expected" ]; then
            echo "::error::no sha256 for ${asset} in gosec checksums file"; exit 1
          fi
          echo "${expected}  /tmp/gosec.tar.gz" | sha256sum --check
          tar -xz --no-same-owner -C "$bindir" -f /tmp/gosec.tar.gz gosec
          rm /tmp/gosec.tar.gz /tmp/gosec_checksums.txt

      # Verify go.mod/go.sum are in sync with the imports. Runs `go mod tidy` then fails
      # if it changed anything (a stray require, a missing sum entry) — mainly guards
      # Renovate bumps. Deterministic because GOTOOLCHAIN=local pins the toolchain.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum not tidy — run 'go mod tidy' and commit the result"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      # vet uses the committed vendor/ tree automatically and fails on inconsistent vendoring.
      - name: go vet
        run: go vet ./...

      # golangci-lint is baked on PATH; uses the committed src/api/.golangci.yml (v2).
      # --allow-parallel-runners: the host executor may run two jobs in one pod, whose
      # shared cache lock otherwise fails the second. retry-etxtbsy guards the shared-FS
      # exec race.
      - name: golangci-lint
        run: bash "$GITHUB_WORKSPACE/.gitea/scripts/retry-etxtbsy" golangci-lint run --allow-parallel-runners

      - name: govulncheck
        run: bash "$GITHUB_WORKSPACE/.gitea/scripts/retry-etxtbsy" govulncheck ./...

      # gosec (SAST). retry-gosec also retries the transient compile/SSA build fault
      # (never a real finding — it keys on the fault signature).
      - name: gosec
        run: bash "$GITHUB_WORKSPACE/.gitea/scripts/retry-gosec" gosec -severity medium -confidence medium ./...

      # -short skips the Testcontainers integration tests (they need a container runtime
      # the host executor lacks); the pure unit tests still run with the race detector.
      - name: go test
        run: go test -short -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage report
        run: go tool cover -func=coverage.out

      - name: Notify on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh

  # DB-backed API tests. `needs: go` gates them on the fast job above — no point
  # provisioning a Postgres pod and running the integration suite if lint/vet/gosec or
  # the unit tests already failed. (When `go` is skipped as irrelevant, this skips too.)
  # The tests use Testcontainers locally, but the host-executor runner has no container
  # runtime, so this provisions a throwaway Postgres *pod*, points TEST_DATABASE_URL at
  # it, runs the non-short suite, and always reaps the pod. Requires the companion
  # homelab-gitops NetworkPolicy (runner <-> the CI Postgres pod on 5432).
  integration:
    name: API Integration Tests
    needs: go
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      # Per-job module cache, outside the shared home directory.
      #
      # The host-executor pod reuses ~/go/pkg/mod between jobs, and a run of broken
      # cache restores left that tree with modules present at the right version but no
      # source in them. `go mod tidy` reported "module …@latest found (v5.3.1), but
      # does not contain package …" and rewrote go.mod — and kept doing it after the
      # restore was removed, because the damage was already on disk.
      #
      # A fresh path per job cannot inherit that, and unlike deleting the shared cache
      # it cannot pull the tree out from under a job running concurrently on the same
      # pod. RUNNER_TEMP is job-scoped, so it is also cleaned up for us.
      #
      # Cheap here: this module is vendored, so only the `go mod tidy` check reads the
      # module cache at all — everything else builds from vendor/.
      GOMODCACHE: ${{ runner.temp }}/gomodcache
      TAR_OPTIONS: --no-same-owner
      # Unique per run so concurrent branches don't collide; DNS-1123 safe (run_id is numeric).
      IT_PG_NAME: itpg-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Same merge preview as the `go` job — the integration suite has to run
      # against the merge result too, or it certifies a tree that never ships.
      - name: Merge main into the head under test
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash "$GITHUB_WORKSPACE/.gitea/scripts/merge-base-branch" "$EVENT_NAME" "$REF_NAME"

      - name: Use the baked Go toolchain
        run: |
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Prepare Go cache dirs
        run: chmod -R u+w ~/.cache/go-build 2>/dev/null || true

      # Build cache only, and the go2- prefix — same reasoning as the `go` job above.
      # This job shares the cache key, so leaving it on the old prefix would keep the
      # poisoned ~/go/pkg/mod archive alive and restore it here instead.
      - name: Cache Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go2-${{ runner.os }}-${{ hashFiles('src/api/go.sum') }}
          restore-keys: go2-${{ runner.os }}-

      # Provision the throwaway Postgres. kubectl uses the act-runner ServiceAccount
      # (in-cluster), which can create/delete pods in the gitea namespace.
      - name: Start Postgres pod
        run: |
          sed "s/__POD_NAME__/${IT_PG_NAME}/" .gitea/ci/postgres.yaml | kubectl create -f -
          echo "Waiting for ${IT_PG_NAME} to accept connections..."
          kubectl wait --for=condition=ready "pod/${IT_PG_NAME}" -n gitea --timeout=150s
          POD_IP=$(kubectl get pod "${IT_PG_NAME}" -n gitea -o jsonpath='{.status.podIP}')
          if [ -z "$POD_IP" ]; then echo "::error::no pod IP for ${IT_PG_NAME}"; exit 1; fi
          echo "POD_IP=${POD_IP}" >> "$GITHUB_ENV"
          echo "Postgres ${IT_PG_NAME} ready at ${POD_IP}:5432"

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://test:test@${{ env.POD_IP }}:5432/iron_temple?sslmode=disable
        run: |
          # kube-router can install the new pod's ACCEPT rules a moment after it's ready
          # (k8s-networking-gotchas §10); retry a TCP connect before the suite so the
          # first query doesn't race the netpol. CI-specific plumbing — deliberately NOT in
          # the shared script, which defines the test invocation and nothing else.
          for i in $(seq 1 20); do
            if timeout 3 bash -c "cat < /dev/null > /dev/tcp/${POD_IP}/5432" 2>/dev/null; then
              echo "Postgres reachable"; break
            fi
            echo "not reachable yet ($i/20), retrying in 3s"; sleep 3
          done
          # The flags (-p 1, -count=1, no -race, not -short) live in the shared script so
          # this job and scripts/preflight.sh's local gate cannot drift apart. The sandbox
          # runs the SAME script against a loopback Postgres.
          sh "$GITHUB_WORKSPACE/dev/integration-test.sh"

      - name: Delete Postgres pod
        if: always()
        run: kubectl delete pod "${IT_PG_NAME}" -n gitea --ignore-not-found --wait=false

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh

  # Required-check gate. Always runs so it always posts a "Go Lint & Test" commit status,
  # even when the backend jobs were skipped (irrelevant paths) or cancelled. Passes when
  # both real jobs succeeded or were legitimately skipped; fails if either failed. Make
  # THIS the required status check in branch protection.
  result:
    name: Go Lint & Test
    needs: [changes, go, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require backend jobs to pass
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} go=${{ needs.go.result }} integration=${{ needs.integration.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change-detection job did not succeed"; exit 1
          fi
          for r in "${{ needs.go.result }}" "${{ needs.integration.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::backend checks did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "backend checks OK"
