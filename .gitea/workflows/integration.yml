---
name: API Integration Tests

# Runs the DB-backed API tests (src/api) against a real Postgres. Those tests normally
# use Testcontainers, which needs a container runtime the host-executor runner doesn't
# have — so instead this job provisions a throwaway Postgres *pod* in the cluster, points
# TEST_DATABASE_URL at it (the tests use that when set), runs the suite, and reaps the pod.
on:
  push:
    branches: ["**"]
    paths:
      - "src/api/**"
      - ".gitea/workflows/integration.yml"
      - ".gitea/ci/postgres.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      TAR_OPTIONS: --no-same-owner
      # Unique per run so concurrent branches don't collide; DNS-1123 safe (run_id is numeric).
      IT_PG_NAME: itpg-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use the baked Go toolchain
        run: |
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Prepare Go cache dirs
        run: chmod -R u+w ~/go/pkg/mod ~/.cache/go-build 2>/dev/null || true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('src/api/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Provision the throwaway Postgres. kubectl uses the act-runner ServiceAccount
      # (in-cluster), which can create/delete pods in the gitea namespace.
      - name: Start Postgres pod
        run: |
          sed "s/__POD_NAME__/${IT_PG_NAME}/" .gitea/ci/postgres.yaml | kubectl create -f -
          echo "Waiting for ${IT_PG_NAME} to accept connections..."
          kubectl wait --for=condition=ready "pod/${IT_PG_NAME}" -n gitea --timeout=150s
          POD_IP=$(kubectl get pod "${IT_PG_NAME}" -n gitea -o jsonpath='{.status.podIP}')
          if [ -z "$POD_IP" ]; then echo "::error::no pod IP for ${IT_PG_NAME}"; exit 1; fi
          echo "POD_IP=${POD_IP}" >> "$GITHUB_ENV"
          echo "Postgres ${IT_PG_NAME} ready at ${POD_IP}:5432"

      - name: Run integration tests
        working-directory: src/api
        env:
          TEST_DATABASE_URL: postgres://test:test@${{ env.POD_IP }}:5432/iron_temple?sslmode=disable
        run: |
          # kube-router can install the new pod's ACCEPT rules a moment after it's ready
          # (k8s-networking-gotchas §10); retry a TCP connect before the suite so the
          # first query doesn't race the netpol.
          for i in $(seq 1 20); do
            if timeout 3 bash -c "cat < /dev/null > /dev/tcp/${POD_IP}/5432" 2>/dev/null; then
              echo "Postgres reachable"; break
            fi
            echo "not reachable yet ($i/20), retrying in 3s"; sleep 3
          done
          # -p 1: the db and api packages share the one database, so serialize the package
          # test binaries (no concurrent migrate/mutate). Not -short → the integration
          # tests run against the pod above instead of self-skipping.
          go test -p 1 -count=1 ./db/ ./internal/api/

      - name: Delete Postgres pod
        if: always()
        run: kubectl delete pod "${IT_PG_NAME}" -n gitea --ignore-not-found --wait=false

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
