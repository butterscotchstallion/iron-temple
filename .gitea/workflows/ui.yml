---
name: UI Check & Test

# Frontend CI for src/ui (Svelte + Vite + pnpm). Type-check, unit tests (Vitest),
# and e2e (Playwright/Firefox). Runs on the shared host-executor runner: Node 20 +
# corepack ship in the base image; the Playwright Firefox *system libs* are baked
# into the runner image (see homelab-gitops services/act-runner/Dockerfile), so this
# job only downloads the Firefox *browser* — and that is cached across runs.
on:
  push:
    branches: ["**"]
    paths:
      - "src/ui/**"
      # The typed client is generated from the backend's OpenAPI contract, so a spec
      # change must re-run check/tests even when nothing under src/ui changed.
      - "src/api/openapi.yaml"
      - ".gitea/workflows/ui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Activate the pinned pnpm via corepack. The job's Node comes from the act
      # toolcache (/opt/acttoolcache/node/.../bin), whose dir the job can't write to —
      # a plain `corepack enable` fails there with EACCES. Install the shim into a
      # writable dir instead ($HOME/.local/bin), publish it via $GITHUB_PATH for the
      # later steps, and also export it in-process so the verify below works (GITHUB_PATH
      # only takes effect in *subsequent* steps). --activate fetches pnpm@<pinned> once;
      # corepack caches it for later runs.
      - name: Enable pnpm
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@9.15.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pnpm --version

      # Cache the pnpm content-addressable store so packages aren't re-fetched.
      # Keyed on the lockfile → only changes when a dependency changes.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('src/ui/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # --frozen-lockfile: reproducible install, fails if the lockfile is stale.
      # --prefer-offline: use the cached store first, hit the (in-cluster) registry only for misses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The hey-api client (src/ui/src/lib/api/) is git-ignored; regenerate it from the
      # backend OpenAPI spec before anything that imports it (check / dev server / e2e).
      - name: Generate API client
        run: pnpm generate:api

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      # Verify the production bundle actually builds. svelte-check type-checks the
      # source, but the vite production build can still fail on bundler/asset issues
      # that `check` never exercises.
      - name: Build (production bundle)
        run: pnpm build

      # Cache the Playwright browser binaries at Playwright's DEFAULT location
      # (~/.cache/ms-playwright). This path is stable across runs, so the browser also
      # persists on the host-executor pod's filesystem between runs — Firefox is reused,
      # not re-downloaded. (An earlier version set PLAYWRIGHT_BROWSERS_PATH under
      # ${{ github.workspace }}, whose act workdir hash changes every run, so Firefox was
      # re-downloaded ~85 MB on every run.) Keyed on the lockfile → the actions/cache
      # entry only rotates when the @playwright/test version bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/ui/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # Firefox only (matches playwright.config.ts). No --with-deps: the system libs are
      # baked into the runner image; --with-deps would try apt as non-root and fail.
      # Idempotent — a warm cache makes this a no-op.
      - name: Install Playwright Firefox
        run: pnpm exec playwright install firefox

      # CI=true → Playwright starts its own `pnpm dev` vite server (reuseExistingServer
      # is false in CI). The suite mocks the API via page.route, so no backend/DB is needed.
      - name: E2E tests (Playwright/Firefox)
        env:
          CI: "true"
        run: pnpm test:e2e

      # On e2e failure, keep the Playwright HTML report + traces so a failure can be
      # debugged from the artifact instead of re-running the job. Pinned to v3.2.2 —
      # actions/upload-artifact@v4+ is unsupported on Gitea Actions (it reports itself
      # as GHES). Paths are workspace-relative (not affected by defaults.working-directory).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            src/ui/playwright-report/
            src/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
