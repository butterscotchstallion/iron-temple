---
name: UI Check & Test

# Frontend CI for src/ui (Svelte + Vite + pnpm). Type-check, unit tests (Vitest),
# and e2e (Playwright/Firefox). Runs on the shared host-executor runner: Node 20 +
# corepack ship in the base image; the Playwright Firefox *system libs* are baked
# into the runner image (see homelab-gitops services/act-runner/Dockerfile), so this
# job only downloads the Firefox *browser* — and that is cached across runs.
#
# Required-status-check safety: this workflow always triggers on every branch push
# (NO `on.paths` filter) so its `result` gate always reports a commit status. Branch
# protection can then require the "UI Check & Test" context and it will never deadlock
# on a PR that doesn't touch src/ui. The path filtering lives in the `changes` job
# instead, so the expensive build/test job still only runs when UI-relevant files
# change. See docs/ci-branch-protection.md.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: did anything UI-relevant change on this push? Its output drives
  # whether the heavy `build` job runs. Always runs so the workflow's own status
  # context is produced even when nothing relevant changed.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      # Full history so `git diff <before>..<sha>` can resolve the pushed range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        run: |
          set -euo pipefail
          # Anything that isn't a normal push (manual dispatch, etc.) → run everything.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "event=${{ github.event_name }} → run everything"
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before="${{ github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          # New branch (before = zeros) or a base commit we don't have → run everything.
          if [ -z "$before" ] || [ "$before" = "$zero" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "no usable base ('$before') → run everything"
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
               | grep -qE '^(src/ui/|src/api/openapi\.yaml$|\.gitea/workflows/ui\.yml$)'; then
            echo "UI-relevant files changed → run"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "no UI-relevant changes → skip build"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: UI Build & Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Activate the pinned pnpm via corepack. The job's Node comes from the act
      # toolcache (/opt/acttoolcache/node/.../bin), whose dir the job can't write to —
      # a plain `corepack enable` fails there with EACCES. Install the shim into a
      # writable dir instead ($HOME/.local/bin), publish it via $GITHUB_PATH for the
      # later steps, and also export it in-process so the verify below works (GITHUB_PATH
      # only takes effect in *subsequent* steps). --activate fetches pnpm@<pinned> once;
      # corepack caches it for later runs.
      - name: Enable pnpm
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@9.15.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pnpm --version

      # Cache the pnpm content-addressable store so packages aren't re-fetched.
      # Keyed on the lockfile → only changes when a dependency changes.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('src/ui/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # --frozen-lockfile: reproducible install, fails if the lockfile is stale.
      # --prefer-offline: use the cached store first, hit the (in-cluster) registry only for misses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The hey-api client (src/ui/src/lib/api/) is git-ignored; regenerate it from the
      # backend OpenAPI spec before anything that imports it (check / dev server / e2e).
      - name: Generate API client
        run: pnpm generate:api

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      # NOTE: the production build (`pnpm build`) is exercised by the e2e job's
      # webServer — playwright.config.ts serves `vite preview` over the built output, so
      # a broken build fails e2e. No separate build step needed (avoids a double build).

      # Cache the Playwright browser binaries at Playwright's DEFAULT location
      # (~/.cache/ms-playwright). This path is stable across runs, so the browser also
      # persists on the host-executor pod's filesystem between runs — Firefox is reused,
      # not re-downloaded. (An earlier version set PLAYWRIGHT_BROWSERS_PATH under
      # ${{ github.workspace }}, whose act workdir hash changes every run, so Firefox was
      # re-downloaded ~85 MB on every run.) Keyed on the lockfile → the actions/cache
      # entry only rotates when the @playwright/test version bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/ui/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # Firefox only (matches playwright.config.ts). No --with-deps: the system libs are
      # baked into the runner image; --with-deps would try apt as non-root and fail.
      # Idempotent — a warm cache makes this a no-op.
      - name: Install Playwright Firefox
        run: pnpm exec playwright install firefox

      # CI=true → Playwright starts its own `pnpm dev` vite server (reuseExistingServer
      # is false in CI). The suite mocks the API via page.route, so no backend/DB is needed.
      - name: E2E tests (Playwright/Firefox)
        env:
          CI: "true"
          # Disable Firefox's in-browser content sandbox. In the locked-down runner pod
          # it can't create its unprivileged user namespace — the browser log shows
          # "Sandbox: writing /proc/self/uid_map: EPERM", after which every content
          # process exits on SIGSEGV, so no tab spawns ("remoteTab is null") and
          # newPage() times out. The pod's own securityContext + seccomp already isolate
          # the browser, so the in-browser sandbox is redundant here. CI-scoped — local
          # runs keep the sandbox enabled.
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
        run: pnpm test:e2e

      # On e2e failure, keep the Playwright HTML report + traces so a failure can be
      # debugged from the artifact instead of re-running the job. Pinned to v3.2.2 —
      # actions/upload-artifact@v4+ is unsupported on Gitea Actions (it reports itself
      # as GHES). Paths are workspace-relative (not affected by defaults.working-directory).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            src/ui/playwright-report/
            src/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh

  # Required-check gate. Always runs (even when `build` was skipped as irrelevant, or
  # cancelled by a newer push) so it always posts a "UI Check & Test" commit status.
  # Passes when the build succeeded OR was legitimately skipped; fails when the build
  # failed. Make THIS the required status check in branch protection.
  result:
    name: UI Check & Test
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require UI build to pass
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}, build: ${{ needs.build.result }}"
          # A broken detector must not silently green-light the gate.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change-detection job did not succeed"; exit 1
          fi
          case "${{ needs.build.result }}" in
            success|skipped) echo "UI checks OK"; exit 0 ;;
            *) echo "::error::UI checks did not pass (build=${{ needs.build.result }})"; exit 1 ;;
          esac
