---
name: ShellCheck (shell script lint)

# Static analysis for every shell script this repo owns — the CI helpers that decide
# which jobs run, the release/notify scripts, and the local gates themselves. These
# have no test suite and mostly run once, in anger, on a runner; shellcheck is the
# only thing standing between an unquoted expansion and a silently mis-skipped job.
#
# shellcheck is baked into the homelab-runner image (see homelab-gitops
# services/act-runner/Dockerfile, ARG SHELLCHECK_VERSION) and called from PATH — same
# arrangement as hadolint, gitleaks and trivy, and no per-run download. If this step
# ever reports "shellcheck: command not found", the image lost it; that is a rebuild,
# not a workflow change.
#
# THE IMAGE TRACKS THE NEWEST RELEASE, AND THE SANDBOX DOES NOT
#
# The devcontainer installs shellcheck from Debian (0.9.0 at time of writing) while the
# runner bakes the current upstream release, which flags strictly more. So this gate can
# fail on a commit that sailed through the pre-commit hook — it is the second deliberate
# one-way divergence in the gate set, after preflight.sh's `pnpm --offline`, and it runs
# in the same direction: CI stricter than local, never the reverse. A local pass is
# still necessary, just not quite sufficient.
#
# When that happens the finding is real — a newer shellcheck reports it because it
# learned to, not because the runner is misconfigured. Fix the script. Closing the gap
# for good means bumping the devcontainer's shellcheck to match the runner's, not
# pinning the runner back.
#
# NO `on.paths` filter, deliberately. Four of the scripts have no extension
# (.gitea/scripts/*), so no glob describes the set without going stale the moment
# someone adds another — and a filter that quietly matches nothing turns this
# workflow into a no-op that still reports green. Discovery is
# dev/list-shell-scripts.sh's job instead, and the whole run takes about a second.
# secret-scan.yml runs on every push for the same kind of reason.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint shell scripts
        # dev/list-shell-scripts.sh is the SAME discovery scripts/preflight.sh runs,
        # so a local pass and a CI pass cover the same files. The list is echoed
        # because a shrinking count is the signal that discovery broke — a green run
        # over zero files otherwise looks exactly like a green run over all of them.
        # retry-etxtbsy guards the shared-pod exec race (see the script's header).
        run: |
          set -euo pipefail
          mapfile -t scripts < <(sh dev/list-shell-scripts.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found — discovery is broken"
            exit 1
          fi
          echo "Linting ${#scripts[@]} shell script(s):"
          printf '  %s\n' "${scripts[@]}"
          bash "$GITHUB_WORKSPACE/.gitea/scripts/retry-etxtbsy" shellcheck "${scripts[@]}"

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: "${{ github.workflow }} / ${{ github.job }}"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
