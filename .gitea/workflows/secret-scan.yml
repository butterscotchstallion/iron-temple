---
name: Secret Scan

# Scans the working tree for committed secrets on every push. gitleaks is baked
# into the homelab-runner image (see homelab-gitops services/act-runner/Dockerfile,
# ARG GITLEAKS_VERSION) — no per-run download; called from PATH.
on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1 # --no-git scans the working tree, not git history

      - name: Scan for secrets
        # --redact masks any finding in the log. --config extends the built-in
        # ruleset and allowlists the repo's dev/test-only credentials (.gitleaks.toml).
        run: gitleaks detect --source . --redact --no-git --verbose --config .gitleaks.toml

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
