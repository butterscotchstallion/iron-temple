---
name: AI Review Canary

# Weekly liveness check for the AI reviewer. Runs the real reviewer against a tiny
# canned diff and verifies it returns well-formed JSON — no Gitea, no PR. Catches
# silent breakage (dead OAuth token, CLI failure, prompt drift that stops producing
# JSON) before a real PR does. Emails only on failure.
on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC (off-peak, off the :00 mark)
  workflow_dispatch:

concurrency:
  group: ai-review-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Reviewer self-check
    runs-on: ubuntu-latest
    env:
      TAR_OPTIONS: --no-same-owner
      UV_PYTHON_INSTALL_DIR: /data/uv/python
      UV_CACHE_DIR: /data/uv/cache
      CLAUDE_CODE_VERSION: "2.1.223"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The self-check reads REVIEW_PROMPT (ai_pr_review.py main()). Its default is
      # ai-review/prompts/pr-review.md, which the submodule does NOT ship (only the
      # .generic.md). Point at the generic prompt so the liveness check doesn't
      # FileNotFoundError — it's stack-agnostic, which is what a canary wants.
      REVIEW_PROMPT: ${{ github.workspace }}/ai-review/prompts/pr-review.generic.md
    steps:
      - name: Check secret configured
        id: secrets
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: CLAUDE_CODE_OAUTH_TOKEN not set -- skipping canary."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pull the ai-review/ submodule (the reviewer script + CLI installer).
          submodules: true

      - name: Prefer IPv4 (no IPv6 on this network)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          grep -q '^precedence ::ffff:0:0/96 100$' /etc/gai.conf 2>/dev/null \
            || echo 'precedence ::ffff:0:0/96 100' >> /etc/gai.conf

      - name: Set up uv
        if: steps.secrets.outputs.configured == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"

      - name: Install Claude Code CLI (cached on PVC)
        if: steps.secrets.outputs.configured == 'true'
        run: ./ai-review/install-claude-cli.sh

      - name: Reviewer self-check
        if: steps.secrets.outputs.configured == 'true'
        working-directory: ai-review
        run: |
          unset SSL_CERT_FILE
          uv sync --frozen
          uv run python ai_pr_review.py --self-check

      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ./scripts/ci-notify.sh
