name: iron-temple-dev

services:
  postgres:
    build: .
    image: iron-temple-postgres:dev
    environment:
      # Superuser for the instance (local only).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Password for the iron_temple tenant role, read by initdb/01-tenant.sql.
      APP_DB_PASSWORD: iron_temple
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
