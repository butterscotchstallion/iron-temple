# Static-serve config for the iron-temple SPA (nginx-unprivileged → :8080).
# /api/* is NOT proxied here — Traefik path-routes it to the API service before it
# reaches this container. This server only serves static assets + SPA fallback.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: serve index.html for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Vite assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
