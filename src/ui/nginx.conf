# Static-serve config for the iron-temple SPA (nginx-unprivileged → :8080).
# /api/* is NOT proxied here — Traefik path-routes it to the API service before it
# reaches this container. This server only serves static assets + SPA fallback.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the way out. The nginx image ships `#gzip on;`
    # commented out in the main nginx.conf, so without this the whole bundle —
    # Svelte runtime, bits-ui, Tailwind, the generated client — goes over the
    # wire raw.
    #
    # gzip_types is not optional here: nginx's default is text/html ALONE, so
    # `gzip on;` by itself would compress the one file that is already tiny and
    # leave every .js and .css uncompressed. text/html is always included and
    # cannot be listed again without a duplicate-entry warning.
    #
    # BOTH JavaScript types are listed, and that is the load-bearing detail.
    # nginx 1.21.1 changed the MIME type its bundled mime.types maps .js to,
    # from application/javascript to text/javascript. The base image is well
    # past that, so the entry chunk is served as text/javascript — and a list
    # naming only application/javascript would compress the stylesheet, quietly
    # skip the bundle, and leave most of the payload raw while looking correct.
    # application/javascript stays for older images and is harmless on new ones.
    # Prefer the .gz the build already wrote (precompressAssets() in
    # vite.config.ts). These assets are immutable and compressed once at level 9,
    # where nginx's own gzip runs at level 1 — the fastest, weakest setting,
    # picked because it otherwise runs on every single request. Serving the
    # prebuilt file sends fewer bytes AND spends no CPU doing it.
    #
    # gzip stays on underneath as the fallback: gzip_static only answers when a
    # matching .gz exists, so anything the build didn't precompress — and any
    # response generated rather than served from disk — still gets compressed
    # the ordinary way.
    gzip_static on;

    gzip on;
    gzip_vary on;
    # Below about a KB the header overhead and the round trip through the
    # compressor cost more than the bytes saved. The build skips the same files
    # for the same reason, so the two agree about what is worth compressing.
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # Client-side routing: serve index.html for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Vite assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The release notes for whatever build this pod is serving, emitted by
    # changelogVirtualModule() in vite.config.ts and read at runtime by the update
    # prompt in a tab that predates this release (src/lib/version.svelte.ts).
    #
    # Not cacheable, for the reason index.html isn't: it is small, mutable, and the
    # entire point is that a tab open since yesterday gets THIS build's copy. Left
    # to itself a browser caches it heuristically off Last-Modified, and the prompt
    # would announce a release while listing the contents of the one before it.
    #
    # An exact-match location, which nginx prefers over the prefix `location /`
    # above. That matters on the way in as much as on the way out: try_files never
    # runs here, so a pod built before this file existed answers 404 instead of
    # serving index.html with a 200 for a path the client will try to parse as JSON.
    location = /changelog.json {
        add_header Cache-Control "no-cache";
    }
}
