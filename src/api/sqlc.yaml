version: "2"
sql:
  - engine: "postgresql"
    # Point sqlc at the schema DDL only (not the seed DML or the down files).
    schema:
      - "db/migrations/0001_init.up.sql"
      - "db/migrations/0003_program_day_weekday.up.sql"
      - "db/migrations/0004_session_finished_at.up.sql"
      - "db/migrations/0005_users.up.sql"
      - "db/migrations/0006_user_current_program.up.sql"
      # 0007 is seed DML only, so it has no schema to declare here.
      - "db/migrations/0008_report_runs.up.sql"
      # 0009 is mixed: the ALTER/CREATE at the top is schema, the catalogue seed
      # in the middle is DML. sqlc ignores the INSERT/UPDATE statements.
      - "db/migrations/0009_exercise_library.up.sql"
      - "db/migrations/0010_session_bodyweight.up.sql"
      # 0011 is mixed the same way 0009 is: the ALTER at the top is schema, the
      # three tier UPDATEs below it are DML that sqlc ignores.
      - "db/migrations/0011_exercise_rest_seconds.up.sql"
      # 0012 is seed DML only, so it has no schema to declare here.
      # 0013 is mixed like 0009 and 0011: three CREATE TABLEs, then the seed
      # INSERTs that fill them for the accounts that already exist.
      - "db/migrations/0013_gym_setup.up.sql"
      - "db/migrations/0014_assistance_rep_range.up.sql"
      # 0015 is mixed: the CHECK swap and program_day_exercise_sets are schema,
      # the Madcow reseed below them is DML.
      - "db/migrations/0015_madcow.up.sql"
      # 0018 is seed DML only, so it has no schema to declare here.
      # 0019 declares e1rm_lb(), which three queries call — sqlc needs the
      # signature to type its result rather than guess at it.
      - "db/migrations/0019_e1rm_function.up.sql"
      - "db/migrations/0020_dumbbell_step.up.sql"
      - "db/migrations/0021_must_change_password.up.sql"
      - "db/migrations/0022_assistance_weight_pin.up.sql"
      # 0023 is seed DML plus a CHECK swap, neither of which types a query.
      - "db/migrations/0024_session_recognition.up.sql"
      - "db/migrations/0025_generated_activity_schedule.up.sql"
      - "db/migrations/0026_notifications.up.sql"
      # 0027 adds session_sets.is_bonus, which six queries select and one
      # writes — sqlc cannot type any of them without the column declared.
      - "db/migrations/0027_session_set_bonus.up.sql"
      - "db/migrations/0028_equipment_setup.up.sql"
      # 0029 is mixed like 0009 and 0015: the ALTERs and the partial indexes are
      # schema, the is_shared backfill below them is DML sqlc ignores.
      - "db/migrations/0029_custom_programs.up.sql"
      # 0030 adds notifications.archived_at, which six queries in
      # notifications.sql filter on. It was missed when that migration landed, so
      # this file went on describing a schema the queries had already moved past
      # — sqlc could not have typed them, and internal/store carried the previous
      # contract's shape until this line was added.
      - "db/migrations/0030_notification_retention.up.sql"
      # 0031 is indexes only: it reshapes notifications_unread_idx for the
      # grouped badge count and declares no column, so it types nothing here.
      # 0032 is mixed like 0009 and 0015: two CREATE TABLEs and the ALTER adding
      # notifications.achievement_slug are schema, the catalogue seed below them
      # is DML sqlc ignores. Every query in achievements.sql needs the two tables
      # declared, and the notifications fan-out needs the new column.
      - "db/migrations/0032_achievements.up.sql"
      # 0033 declares follows, which the crown fan-out reads and which the roster
      # and the profile each test with an EXISTS. Nothing can be typed without it.
      - "db/migrations/0033_follows.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
