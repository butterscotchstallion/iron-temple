version: "2"
sql:
  - engine: "postgresql"
    # Point sqlc at the schema DDL only (not the seed DML or the down files).
    schema:
      - "db/migrations/0001_init.up.sql"
      - "db/migrations/0003_program_day_weekday.up.sql"
      - "db/migrations/0004_session_finished_at.up.sql"
      - "db/migrations/0005_users.up.sql"
      - "db/migrations/0006_user_current_program.up.sql"
      # 0007 is seed DML only, so it has no schema to declare here.
      - "db/migrations/0008_report_runs.up.sql"
      # 0009 is mixed: the ALTER/CREATE at the top is schema, the catalogue seed
      # in the middle is DML. sqlc ignores the INSERT/UPDATE statements.
      - "db/migrations/0009_exercise_library.up.sql"
      - "db/migrations/0010_session_bodyweight.up.sql"
      # 0011 is mixed the same way 0009 is: the ALTER at the top is schema, the
      # three tier UPDATEs below it are DML that sqlc ignores.
      - "db/migrations/0011_exercise_rest_seconds.up.sql"
      # 0012 is seed DML only, so it has no schema to declare here.
      # 0013 is mixed like 0009 and 0011: three CREATE TABLEs, then the seed
      # INSERTs that fill them for the accounts that already exist.
      - "db/migrations/0013_gym_setup.up.sql"
      - "db/migrations/0014_assistance_rep_range.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
