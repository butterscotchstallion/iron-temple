# air — live-reload for the API (`make dev`): rebuild + restart ./cmd/server when
# .go or migration .sql files change. https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  # Rebuild on Go changes and on migration SQL (embedded via go:embed).
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "vendor"]
  # Debounce rapid saves. stop_on_error=false: on a broken build, keep the last
  # good binary serving instead of killing it (air's flag means "stop the old
  # binary WHEN a build errors" — false = don't).
  delay = 300
  stop_on_error = false

[misc]
  clean_on_exit = true
