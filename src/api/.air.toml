# air — live-reload for the API (`make dev`): rebuild + restart ./cmd/server when
# .go or migration .sql files change. https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  # Rebuild on Go changes and on migration SQL (embedded via go:embed).
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "vendor"]
  # Debounce rapid saves; keep the last good binary running if a build fails.
  delay = 300
  stop_on_error = true

[misc]
  clean_on_exit = true
