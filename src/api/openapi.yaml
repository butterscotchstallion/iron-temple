openapi: 3.0.3
info:
  title: Iron Temple API
  version: 0.1.0
  description: >
    REST API for the Iron Temple weight-lifting tracker. Single implicit user,
    no authentication. All weights are in pounds (lb).

    Programs are made of days (e.g. Workout A / B); each day prescribes exercises
    with sets, reps, and a starting weight. A session is a performed instance of
    a day, with one logged set per prescribed set.

    Progression is linear and computed server-side from session history:
    +5 lb per session on squat, bench, row, and overhead press; +10 lb on
    deadlift; a 10% deload after three consecutive failed sessions on a lift.

servers:
  - url: /api/v1

tags:
  - name: meta
  - name: exercises
  - name: programs
  - name: sessions

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List all exercises
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"

  /exercises/{exerciseId}/history:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [exercises]
      operationId: getExerciseHistory
      summary: Per-session weight history for a lift (oldest first)
      responses:
        "200":
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseHistoryPoint"

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List available programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program with its days and prescribed exercises
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/days/{dayId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    patch:
      tags: [programs]
      operationId: updateProgramDayWeekday
      summary: Set or clear the weekday a program day is scheduled on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramDayRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/days/{dayId}/next-session:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    get:
      tags: [programs]
      operationId: previewNextSession
      summary: Preview the next session for a program day
      description: >
        Returns the prescription for the day with weights computed from history
        via the program's progression rules. Does not create a session.
      responses:
        "200":
          description: Prescribed next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescribedSession"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List performed sessions (most recent first)
      parameters:
        - name: programId
          in: query
          required: false
          description: Filter to sessions of a given program
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session from a program day
      description: >
        Materializes the day's prescription (with progression-computed weights)
        into a new session and its logged sets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session with its sets
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: Update session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Delete a session
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{sessionId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/SetId"
    patch:
      tags: [sessions]
      operationId: updateSessionSet
      summary: Log or amend a single set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionSetRequest"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DayId:
      name: dayId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          example: session 42 not found

    Exercise:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Squat

    ExerciseHistoryPoint:
      description: One performed session's top set for a lift.
      type: object
      required: [performedOn, weightLb, reps, completed]
      properties:
        performedOn:
          type: string
          format: date
        weightLb:
          type: number
          minimum: 0
        reps:
          type: integer
        completed:
          type: boolean

    ProgressionKind:
      type: string
      enum: [linear]

    ProgramSummary:
      type: object
      required: [id, name, description, progressionKind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: StrongLifts 5x5
        description:
          type: string
        progressionKind:
          $ref: "#/components/schemas/ProgressionKind"

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/ProgramDay"

    ProgramDay:
      type: object
      required: [id, name, position, weekday, exercises]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Workout A
        position:
          type: integer
          example: 1
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null if unscheduled.
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayExercise"

    UpdateProgramDayRequest:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null to unschedule.

    ProgramDayExercise:
      type: object
      required:
        [id, exerciseId, exerciseName, position, sets, reps, startingWeightLb, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        position:
          type: integer
          example: 1
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        startingWeightLb:
          type: number
          minimum: 0
          example: 45
        restSeconds:
          type: integer
          description: Prescribed rest between sets (default 180 = 3 minutes)
          example: 180

    PrescribedSession:
      description: A day's prescription with progression-computed weights, not yet saved.
      type: object
      required: [programId, programDayId, programDayName, exercises]
      properties:
        programId:
          type: integer
          format: int64
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExercise"

    PrescribedExercise:
      type: object
      required: [exerciseId, exerciseName, sets, reps, weightLb, restSeconds]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        weightLb:
          type: number
          minimum: 0
          description: Computed target weight for this session
          example: 50
        restSeconds:
          type: integer
          example: 180

    CreateSessionRequest:
      type: object
      required: [programDayId]
      properties:
        programDayId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
          description: Defaults to the server's current date if omitted

    UpdateSessionRequest:
      type: object
      properties:
        performedOn:
          type: string
          format: date
        notes:
          type: string

    UpdateSessionSetRequest:
      type: object
      description: Any subset of fields may be provided.
      properties:
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Reps actually completed; null clears a prior entry
        weightLb:
          type: number
          minimum: 0
          description: Override the target weight actually lifted
        completed:
          type: boolean

    Session:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, notes, createdAt, sets]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        performedOn:
          type: string
          format: date
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SessionSet"

    SessionSet:
      type: object
      required:
        [id, exerciseId, exerciseName, setNumber, targetReps, weightLb, completed, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        setNumber:
          type: integer
          example: 1
        targetReps:
          type: integer
          example: 5
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Null until the set is logged
        weightLb:
          type: number
          minimum: 0
          example: 50
        completed:
          type: boolean
        restSeconds:
          type: integer
          example: 180

    SessionExerciseWeight:
      description: An exercise's set/rep prescription and top weight for a session.
      type: object
      required: [exerciseName, sets, reps, weightLb]
      properties:
        exerciseName:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        weightLb:
          type: number
          minimum: 0

    SessionSummary:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, setCount, completedSetCount, exercises]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
        performedOn:
          type: string
          format: date
        setCount:
          type: integer
        completedSetCount:
          type: integer
        exercises:
          type: array
          description: Per-exercise top weights, in prescription order.
          items:
            $ref: "#/components/schemas/SessionExerciseWeight"

    SessionList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
