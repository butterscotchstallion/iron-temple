openapi: 3.0.3
info:
  title: Iron Temple API
  version: 0.1.0
  description: >
    REST API for the Iron Temple weight-lifting tracker. All weights are in
    pounds (lb).

    Authentication is a session cookie (`it_session`), issued by
    `POST /auth/login` and revoked by `POST /auth/logout`. Every endpoint
    requires it except `/health`, the `/auth/*` endpoints, and avatar images.
    Registration is open only while no account exists: the first sign-up claims
    the install and closes the door behind it.

    Programs, days and exercises are shared — the prescription is the same for
    everyone. Sessions are per-user: what you lifted is yours, and progression
    is computed from your own history alone.

    Programs are made of days (e.g. Workout A / B); each day prescribes exercises
    with sets, reps, and a starting weight. A session is a performed instance of
    a day, with one logged set per prescribed set.

    Progression is linear and computed server-side from session history:
    +5 lb per session on squat, bench, row, and overhead press; +10 lb on
    deadlift; a 10% deload after three consecutive failed sessions on a lift.

servers:
  - url: /api/v1

# Applies to every operation; the handful of public ones override with
# `security: []`.
security:
  - cookieAuth: []

tags:
  - name: meta
  - name: auth
  - name: users
  - name: exercises
  - name: programs
  - name: sessions

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness/readiness probe
      # A Kubernetes probe cannot present a cookie.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/registration-status:
    get:
      tags: [auth]
      operationId: getRegistrationStatus
      summary: Whether an account can still be created
      description: >
        Lets the sign-in page decide between "sign in" and "create account".
        Public, because a signed-out visitor is exactly who needs the answer.
      security: []
      responses:
        "200":
          description: Registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create the first account and sign in
      description: >
        Succeeds only while no account exists; afterwards it returns 403.
        Sessions logged before any account existed are adopted by this user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              description: Session cookie (`it_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: >
                Session cookie (`it_session`). Without `rememberMe` it is a
                browser-session cookie; with it, `Max-Age` is 60 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out, revoking this session server-side
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update display name, avatar colour, or current program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: Change the password, revoking all other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in, or the current password was wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload an avatar image
      description: >
        Accepts a PNG or JPEG of at most 256 KB and 1024x1024 pixels. The image
        is decoded and re-encoded before storage, which drops EXIF metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: deleteAvatar
      summary: Remove the avatar, falling back to the initials chip
      responses:
        "204":
          description: Removed (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserAvatar
      summary: An avatar image
      description: >
        Public, because this is an `<img>` source and a browser cannot attach
        credentials to one. Responds with an ETag; honours `If-None-Match`.
      security: []
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified
        "404":
          $ref: "#/components/responses/NotFound"

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List all exercises
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseId}/history:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [exercises]
      operationId: getExerciseHistory
      summary: Per-session weight history for a lift (oldest first)
      responses:
        "200":
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseHistoryPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List available programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program with its days and prescribed exercises
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    patch:
      tags: [programs]
      operationId: updateProgramDayWeekday
      summary: Set or clear the weekday a program day is scheduled on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramDayRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}/next-session:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    get:
      tags: [programs]
      operationId: previewNextSession
      summary: Preview the next session for a program day
      description: >
        Returns the prescription for the day with weights computed from history
        via the program's progression rules. Does not create a session.
      responses:
        "200":
          description: Prescribed next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescribedSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List performed sessions (most recent first)
      parameters:
        - name: programId
          in: query
          required: false
          description: Filter to sessions of a given program
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session from a program day
      description: >
        Materializes the day's prescription (with progression-computed weights)
        into a new session and its logged sets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session with its sets
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: Update session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Delete a session
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: finishSession
      summary: End a session
      description: >
        Stamps finishedAt and marks the session over, whether or not every set
        hit its target. Idempotent: finishing an already-finished session leaves
        the original timestamp in place. A session also becomes over on its own
        12 hours after it was started.
      responses:
        "200":
          description: The finished session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/SetId"
    patch:
      tags: [sessions]
      operationId: updateSessionSet
      summary: Log or amend a single set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionSetRequest"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: it_session
      description: >
        Opaque session token. Set by the server as an HttpOnly, SameSite=Lax
        cookie — it is never readable by, or set from, JavaScript, so clients
        neither send nor manage it explicitly.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DayId:
      name: dayId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, or the session has expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: Release version of the running API (ldflags at build).
          example: v0.1.0
        environment:
          type: string
          description: Deployment environment (development or production).
          example: production

    User:
      type: object
      required: [id, username, displayName, avatarColor, isAdmin, hasAvatar]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: ada
        displayName:
          type: string
          example: Ada Lovelace
        avatarColor:
          type: string
          description: >
            Hex colour for the initials chip. Empty means the UI derives one
            from the id.
          example: "#b026ff"
        isAdmin:
          type: boolean
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program the user last opened, which the app lands on instead of
            the picker. Absent until they open one; the UI then falls back to
            the program of their most recent session.
        hasAvatar:
          type: boolean
          description: Whether to render the image or the initials chip.
        avatarEtag:
          type: string
          description: >
            Append to the avatar URL as a cache-buster so a new upload shows
            immediately.

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: True only while no account exists.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9._-]+$"
        displayName:
          type: string
          maxLength: 64
          description: Defaults to the username when omitted.
        password:
          type: string
          format: password
          minLength: 8
        rememberMe:
          type: boolean
          default: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: >
            Issues a 60-day cookie whose expiry slides forward as it is used,
            instead of one that dies with the browser session.

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatarColor:
          type: string
          description: Hex colour, or empty to fall back to the derived one.
          example: "#b026ff"
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program to remember as the user's current one. Must name an
            existing program. There is no way to clear it back to unset — a
            program the user has opened is only forgotten when it is deleted.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    Avatar:
      type: object
      required: [etag]
      properties:
        etag:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          example: session 42 not found

    Exercise:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Squat

    ExerciseHistoryPoint:
      description: One performed session's top set for a lift.
      type: object
      required: [performedOn, weightLb, reps, completed]
      properties:
        performedOn:
          type: string
          format: date
        weightLb:
          type: number
          minimum: 0
        reps:
          type: integer
        completed:
          type: boolean

    ProgressionKind:
      type: string
      enum: [linear]

    ProgramSummary:
      type: object
      required: [id, name, description, progressionKind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: StrongLifts 5x5
        description:
          type: string
        progressionKind:
          $ref: "#/components/schemas/ProgressionKind"

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/ProgramDay"

    ProgramDay:
      type: object
      required: [id, name, position, weekday, exercises]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Workout A
        position:
          type: integer
          example: 1
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null if unscheduled.
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayExercise"

    UpdateProgramDayRequest:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null to unschedule.

    ProgramDayExercise:
      type: object
      required:
        [id, exerciseId, exerciseName, position, sets, reps, startingWeightLb, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        position:
          type: integer
          example: 1
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        startingWeightLb:
          type: number
          minimum: 0
          example: 45
        restSeconds:
          type: integer
          description: Prescribed rest between sets (default 180 = 3 minutes)
          example: 180

    PrescribedSession:
      description: A day's prescription with progression-computed weights, not yet saved.
      type: object
      required: [programId, programDayId, programDayName, exercises]
      properties:
        programId:
          type: integer
          format: int64
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExercise"

    PrescribedExercise:
      type: object
      required: [exerciseId, exerciseName, sets, reps, weightLb, restSeconds, progression]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        weightLb:
          type: number
          minimum: 0
          description: Computed target weight for this session
          example: 50
        restSeconds:
          type: integer
          example: 180
        progression:
          $ref: "#/components/schemas/ProgressionInfo"

    ProgressionInfo:
      description: >-
        Why the engine chose this lift's weight, so the UI can surface an
        impending stall or a deload instead of a bare number.
      type: object
      required: [status, failureCount, failuresBeforeDeload, previousWeightLb]
      properties:
        status:
          type: string
          enum: [start, advance, hold, deload]
          description: >-
            start (no history), advance (last session passed), hold (recent
            failure, repeating the weight), deload (stall hit the threshold, weight
            dropped).
          example: hold
        failureCount:
          type: integer
          minimum: 0
          description: Consecutive failed sessions at the current working weight.
          example: 2
        failuresBeforeDeload:
          type: integer
          minimum: 1
          description: Failures at a weight that trigger a deload.
          example: 3
        previousWeightLb:
          type: number
          minimum: 0
          description: >-
            The weight just worked — advanced past, repeated, or deloaded from;
            0 when there is no history.
          example: 185

    CreateSessionRequest:
      type: object
      required: [programDayId]
      properties:
        programDayId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
          description: Defaults to the server's current date if omitted

    UpdateSessionRequest:
      type: object
      properties:
        performedOn:
          type: string
          format: date
        notes:
          type: string

    UpdateSessionSetRequest:
      type: object
      description: Any subset of fields may be provided.
      properties:
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Reps actually completed; null clears a prior entry
        weightLb:
          type: number
          minimum: 0
          description: Override the target weight actually lifted
        completed:
          type: boolean

    Session:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, notes, createdAt, isOver, sets]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        performedOn:
          type: string
          format: date
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the lifter pressed Finish. Null if they never did — the session
            may still be over, having aged past the 12-hour cutoff.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago. An over session is read-only and is what the
            progression engine counts.
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SessionSet"

    SessionSet:
      type: object
      required:
        [id, exerciseId, exerciseName, setNumber, targetReps, weightLb, completed, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        setNumber:
          type: integer
          example: 1
        targetReps:
          type: integer
          example: 5
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Null until the set is logged
        weightLb:
          type: number
          minimum: 0
          example: 50
        completed:
          type: boolean
        restSeconds:
          type: integer
          example: 180

    SessionExerciseWeight:
      description: An exercise's set/rep prescription and top weight for a session.
      type: object
      required: [exerciseName, sets, reps, weightLb]
      properties:
        exerciseName:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        weightLb:
          type: number
          minimum: 0

    SessionSummary:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, setCount, completedSetCount, volumeLb, isOver, exercises]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
        performedOn:
          type: string
          format: date
        setCount:
          type: integer
        completedSetCount:
          type: integer
        volumeLb:
          type: number
          minimum: 0
          example: 8450
          description: >
            Total weight moved in this session — the sum of actualReps × weightLb
            over every set with reps logged. A set logged short of its target
            still counts what was lifted, so this does not track completedSetCount.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago.
        exercises:
          type: array
          description: Per-exercise top weights, in prescription order.
          items:
            $ref: "#/components/schemas/SessionExerciseWeight"

    SessionList:
      type: object
      required: [items, total, totalVolumeLb, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
        totalVolumeLb:
          type: number
          minimum: 0
          example: 412650
          description: >
            Volume summed over every session matching the filter, not just the
            ones on this page — a lifetime total that does not change as the
            caller pages through the history.
        limit:
          type: integer
        offset:
          type: integer
