openapi: 3.0.3
info:
  title: Iron Temple API
  version: 0.1.0
  description: >
    REST API for the Iron Temple weight-lifting tracker. All weights are in
    pounds (lb).

    Authentication is a session cookie (`it_session`), issued by
    `POST /auth/login` and revoked by `POST /auth/logout`. Every endpoint
    requires it except `/health`, the `/auth/*` endpoints, and avatar images.
    Registration is open only while no account exists: the first sign-up claims
    the install and closes the door behind it.

    Programs, days and exercises are shared — the prescription is the same for
    everyone. Sessions are per-user: what you lifted is yours, and progression
    is computed from your own history alone.

    Programs are made of days (e.g. Workout A / B); each day prescribes exercises
    with sets, reps, and a starting weight. A session is a performed instance of
    a day, with one logged set per prescribed set.

    Progression is linear and computed server-side from session history:
    +5 lb per session on squat, bench, row, and overhead press; +10 lb on
    deadlift; a 10% deload after three consecutive failed sessions on a lift.

servers:
  - url: /api/v1

# Applies to every operation; the handful of public ones override with
# `security: []`.
security:
  - cookieAuth: []

tags:
  - name: meta
  - name: auth
  - name: users
  - name: exercises
  - name: programs
  - name: sessions

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness/readiness probe
      # A Kubernetes probe cannot present a cookie.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/registration-status:
    get:
      tags: [auth]
      operationId: getRegistrationStatus
      summary: Whether an account can still be created
      description: >
        Lets the sign-in page decide between "sign in" and "create account".
        Public, because a signed-out visitor is exactly who needs the answer.
      security: []
      responses:
        "200":
          description: Registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create the first account and sign in
      description: >
        Succeeds only while no account exists; afterwards it returns 403.
        Sessions logged before any account existed are adopted by this user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              description: Session cookie (`it_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: >
                Session cookie (`it_session`). Without `rememberMe` it is a
                browser-session cookie; with it, `Max-Age` is 60 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out, revoking this session server-side
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update display name, avatar colour, or current program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: Change the password, revoking all other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in, or the current password was wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload an avatar image
      description: >
        Accepts a PNG or JPEG of at most 256 KB and 1024x1024 pixels. The image
        is decoded and re-encoded before storage, which drops EXIF metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: deleteAvatar
      summary: Remove the avatar, falling back to the initials chip
      responses:
        "204":
          description: Removed (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserAvatar
      summary: An avatar image
      description: >
        Public, because this is an `<img>` source and a browser cannot attach
        credentials to one. Responds with an ETag; honours `If-None-Match`.
      security: []
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified
        "404":
          $ref: "#/components/responses/NotFound"

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List all exercises
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseId}/history:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [exercises]
      operationId: getExerciseHistory
      summary: Per-session weight history for a lift (oldest first)
      responses:
        "200":
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseHistoryPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List available programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program with its days and prescribed exercises
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    patch:
      tags: [programs]
      operationId: updateProgramDayWeekday
      summary: Set or clear the weekday a program day is scheduled on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramDayRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}/next-session:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    get:
      tags: [programs]
      operationId: previewNextSession
      summary: Preview the next session for a program day
      description: >
        Returns the prescription for the day with weights computed from history
        via the program's progression rules. Does not create a session.
      responses:
        "200":
          description: Prescribed next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescribedSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /racked:
    get:
      tags: [racked]
      operationId: getRacked
      summary: Statistics recap for one month or year
      description: >
        The Racked recap: headline volume, hero moments and the series behind
        each chart, for the calendar month or year containing `on`. The same
        report is rendered into the monthly and yearly recap email, so the two
        can never disagree.
      parameters:
        - name: period
          in: query
          required: false
          description: Granularity of the recap. Defaults to month.
          schema:
            type: string
            enum: [month, year]
            default: month
        - name: on
          in: query
          required: false
          description: >
            Any date inside the wanted period; the server expands it to the
            whole month or year. Defaults to today, so the recap opens on the
            period in progress.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RackedReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List performed sessions (most recent first)
      parameters:
        - name: programId
          in: query
          required: false
          description: Filter to sessions of a given program
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session from a program day
      description: >
        Materializes the day's prescription (with progression-computed weights)
        into a new session and its logged sets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session with its sets
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: Update session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Delete a session
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: finishSession
      summary: End a session
      description: >
        Stamps finishedAt and marks the session over, whether or not every set
        hit its target. Idempotent: finishing an already-finished session leaves
        the original timestamp in place. A session also becomes over on its own
        12 hours after it was started.
      responses:
        "200":
          description: The finished session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/SetId"
    patch:
      tags: [sessions]
      operationId: updateSessionSet
      summary: Log or amend a single set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionSetRequest"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: it_session
      description: >
        Opaque session token. Set by the server as an HttpOnly, SameSite=Lax
        cookie — it is never readable by, or set from, JavaScript, so clients
        neither send nor manage it explicitly.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DayId:
      name: dayId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, or the session has expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: Release version of the running API (ldflags at build).
          example: v0.1.0
        environment:
          type: string
          description: Deployment environment (development or production).
          example: production

    User:
      type: object
      required: [id, username, displayName, avatarColor, isAdmin, hasAvatar]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: ada
        displayName:
          type: string
          example: Ada Lovelace
        avatarColor:
          type: string
          description: >
            Hex colour for the initials chip. Empty means the UI derives one
            from the id.
          example: "#b026ff"
        isAdmin:
          type: boolean
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program the user last opened, which the app lands on instead of
            the picker. Absent until they open one; the UI then falls back to
            the program of their most recent session.
        hasAvatar:
          type: boolean
          description: Whether to render the image or the initials chip.
        avatarEtag:
          type: string
          description: >
            Append to the avatar URL as a cache-buster so a new upload shows
            immediately.

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: True only while no account exists.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9._-]+$"
        displayName:
          type: string
          maxLength: 64
          description: Defaults to the username when omitted.
        password:
          type: string
          format: password
          minLength: 8
        rememberMe:
          type: boolean
          default: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: >
            Issues a 60-day cookie whose expiry slides forward as it is used,
            instead of one that dies with the browser session.

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatarColor:
          type: string
          description: Hex colour, or empty to fall back to the derived one.
          example: "#b026ff"
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program to remember as the user's current one. Must name an
            existing program. There is no way to clear it back to unset — a
            program the user has opened is only forgotten when it is deleted.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    Avatar:
      type: object
      required: [etag]
      properties:
        etag:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          example: session 42 not found

    Exercise:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Squat

    ExerciseHistoryPoint:
      description: One performed session's top set for a lift.
      type: object
      required: [performedOn, weightLb, reps, completed]
      properties:
        performedOn:
          type: string
          format: date
        weightLb:
          type: number
          minimum: 0
        reps:
          type: integer
        completed:
          type: boolean

    ProgressionKind:
      type: string
      enum: [linear]

    ProgramSummary:
      type: object
      required: [id, name, description, progressionKind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: StrongLifts 5x5
        description:
          type: string
        progressionKind:
          $ref: "#/components/schemas/ProgressionKind"

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/ProgramDay"

    ProgramDay:
      type: object
      required: [id, name, position, weekday, exercises]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Workout A
        position:
          type: integer
          example: 1
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null if unscheduled.
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayExercise"

    UpdateProgramDayRequest:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null to unschedule.

    ProgramDayExercise:
      type: object
      required:
        [id, exerciseId, exerciseName, position, sets, reps, startingWeightLb, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        position:
          type: integer
          example: 1
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        startingWeightLb:
          type: number
          minimum: 0
          example: 45
        restSeconds:
          type: integer
          description: Prescribed rest between sets (default 180 = 3 minutes)
          example: 180

    PrescribedSession:
      description: A day's prescription with progression-computed weights, not yet saved.
      type: object
      required: [programId, programDayId, programDayName, exercises]
      properties:
        programId:
          type: integer
          format: int64
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExercise"

    PrescribedExercise:
      type: object
      required: [exerciseId, exerciseName, sets, reps, weightLb, restSeconds, progression]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        weightLb:
          type: number
          minimum: 0
          description: Computed target weight for this session
          example: 50
        restSeconds:
          type: integer
          example: 180
        progression:
          $ref: "#/components/schemas/ProgressionInfo"

    ProgressionInfo:
      description: >-
        Why the engine chose this lift's weight, so the UI can surface an
        impending stall or a deload instead of a bare number.
      type: object
      required: [status, failureCount, failuresBeforeDeload, previousWeightLb]
      properties:
        status:
          type: string
          enum: [start, advance, hold, deload]
          description: >-
            start (no history), advance (last session passed), hold (recent
            failure, repeating the weight), deload (stall hit the threshold, weight
            dropped).
          example: hold
        failureCount:
          type: integer
          minimum: 0
          description: Consecutive failed sessions at the current working weight.
          example: 2
        failuresBeforeDeload:
          type: integer
          minimum: 1
          description: Failures at a weight that trigger a deload.
          example: 3
        previousWeightLb:
          type: number
          minimum: 0
          description: >-
            The weight just worked — advanced past, repeated, or deloaded from;
            0 when there is no history.
          example: 185

    CreateSessionRequest:
      type: object
      required: [programDayId]
      properties:
        programDayId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
          description: Defaults to the server's current date if omitted

    UpdateSessionRequest:
      type: object
      properties:
        performedOn:
          type: string
          format: date
        notes:
          type: string

    UpdateSessionSetRequest:
      type: object
      description: Any subset of fields may be provided.
      properties:
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Reps actually completed; null clears a prior entry
        weightLb:
          type: number
          minimum: 0
          description: Override the target weight actually lifted
        completed:
          type: boolean

    Session:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, notes, createdAt, isOver, sets]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        performedOn:
          type: string
          format: date
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the lifter pressed Finish. Null if they never did — the session
            may still be over, having aged past the 12-hour cutoff.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago. An over session is read-only and is what the
            progression engine counts.
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SessionSet"

    SessionSet:
      type: object
      required:
        [id, exerciseId, exerciseName, setNumber, targetReps, weightLb, completed, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        setNumber:
          type: integer
          example: 1
        targetReps:
          type: integer
          example: 5
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Null until the set is logged
        weightLb:
          type: number
          minimum: 0
          example: 50
        completed:
          type: boolean
        restSeconds:
          type: integer
          example: 180

    SessionExerciseWeight:
      description: An exercise's set/rep prescription and top weight for a session.
      type: object
      required: [exerciseName, sets, reps, weightLb]
      properties:
        exerciseName:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        weightLb:
          type: number
          minimum: 0

    SessionSummary:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, setCount, completedSetCount, volumeLb, isOver, exercises]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
        performedOn:
          type: string
          format: date
        setCount:
          type: integer
        completedSetCount:
          type: integer
        volumeLb:
          type: number
          minimum: 0
          example: 8450
          description: >
            Total weight moved in this session — the sum of actualReps × weightLb
            over every set with reps logged. A set logged short of its target
            still counts what was lifted, so this does not track completedSetCount.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago.
        exercises:
          type: array
          description: Per-exercise top weights, in prescription order.
          items:
            $ref: "#/components/schemas/SessionExerciseWeight"

    SessionList:
      type: object
      required: [items, total, totalVolumeLb, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
        totalVolumeLb:
          type: number
          minimum: 0
          example: 412650
          description: >
            Volume summed over every session matching the filter, not just the
            ones on this page — a lifetime total that does not change as the
            caller pages through the history.
        limit:
          type: integer
        offset:
          type: integer

    # ---- Racked ----
    # The recap. Every statistic is computed server-side so that the page and
    # the monthly email render the same numbers from the same report; nothing
    # here is aggregated again on the client.

    RackedReport:
      type: object
      required:
        [period, totals, change, comparison, lifts, series, mostImproved, days, weekdays,
         bestWeekday, hours, peakHour, hourLabel, streak, attendance, prs, milestones, heaviestSet,
         fastestSession, deloads, archetype]
      properties:
        period:
          $ref: "#/components/schemas/RackedPeriod"
        totals:
          $ref: "#/components/schemas/RackedTotals"
        change:
          allOf:
            - $ref: "#/components/schemas/RackedChange"
          nullable: true
          description: >
            Movement against the preceding period, or null when that period
            holds no sessions to compare against.
        comparison:
          $ref: "#/components/schemas/RackedComparison"
        lifts:
          type: array
          description: Volume split by lift, heaviest first.
          items:
            $ref: "#/components/schemas/RackedLiftSlice"
        series:
          type: array
          description: One estimated-max progression per lift, oldest point first.
          items:
            $ref: "#/components/schemas/RackedSeries"
        mostImproved:
          allOf:
            - $ref: "#/components/schemas/RackedImprovement"
          nullable: true
          description: Null until a lift has been performed twice in the period.
        days:
          type: array
          description: Per-day tonnage for the calendar heatmap, oldest first.
          items:
            $ref: "#/components/schemas/RackedDayVolume"
        weekdays:
          type: array
          description: Volume by weekday, indexed 0 = Sunday to match programDay.weekday.
          minItems: 7
          maxItems: 7
          items:
            type: number
        bestWeekday:
          type: integer
          minimum: -1
          maximum: 6
          description: Weekday with the most volume, or -1 when nothing was lifted.
        hours:
          type: array
          description: Session start counts by hour of day in the server's report zone.
          minItems: 24
          maxItems: 24
          items:
            type: integer
        peakHour:
          type: integer
          minimum: -1
          maximum: 23
          description: >
            The hour `hourLabel` describes — the earliest hour holding the most
            session starts — or -1 when no session carries a start time. Read
            this rather than scanning `hours`, so the bar a surface accents is
            the one the label is talking about.
        hourLabel:
          type: string
          example: Early bird
          description: Empty when there are no sessions to characterise.
        streak:
          $ref: "#/components/schemas/RackedStreak"
        attendance:
          $ref: "#/components/schemas/RackedAttendance"
        prs:
          type: array
          items:
            $ref: "#/components/schemas/RackedPR"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/RackedMilestone"
        heaviestSet:
          allOf:
            - $ref: "#/components/schemas/RackedSetHighlight"
          nullable: true
        fastestSession:
          allOf:
            - $ref: "#/components/schemas/RackedSessionHighlight"
          nullable: true
          description: >
            Null when no session in the period was finished by hand — an
            unfinished session has no duration worth reporting.
        deloads:
          type: array
          items:
            $ref: "#/components/schemas/RackedDeload"
        archetype:
          $ref: "#/components/schemas/RackedArchetype"

    RackedPeriod:
      type: object
      required: [kind, start, end, label, inProgress]
      properties:
        kind:
          type: string
          enum: [month, year]
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: Inclusive last day of the period.
        label:
          type: string
          example: March 2026
        inProgress:
          type: boolean
          description: >
            Whether the period is still running. Every rate in the report is
            then measured over the days that have elapsed rather than the
            period's whole length, and `change` compares the same stretch of
            the preceding period — so a month three days old is not weighed
            against a month that ran its full length.

    RackedTotals:
      type: object
      required: [volumeLb, sessions, sets, reps]
      properties:
        volumeLb:
          type: number
          minimum: 0
          description: Same formula as SessionSummary.volumeLb — actualReps × weightLb.
        sessions:
          type: integer
        sets:
          type: integer
        reps:
          type: integer

    RackedChange:
      type: object
      required: [volumeLb, volumePct, sessions, sessionsPct]
      properties:
        volumeLb:
          type: number
          description: Signed difference against the preceding period.
        volumePct:
          type: number
          nullable: true
          description: >
            Fraction, so 0.12 is +12%. Null when the preceding period moved no
            weight, because growth from zero is not a ratio.
        sessions:
          type: integer
        sessionsPct:
          type: number
          nullable: true

    RackedComparison:
      type: object
      required: [count, label, unitLb]
      properties:
        count:
          type: integer
          minimum: 0
          description: Zero when the volume is too small for even the lightest object.
        label:
          type: string
          example: school buses
          description: Already pluralised to agree with count.
        unitLb:
          type: number

    RackedLiftSlice:
      type: object
      required: [exerciseId, exerciseName, volumeLb, sets, reps, share]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        volumeLb:
          type: number
        sets:
          type: integer
        reps:
          type: integer
        share:
          type: number
          minimum: 0
          maximum: 1

    RackedSeries:
      type: object
      required: [exerciseId, exerciseName, points]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/RackedSeriesPoint"

    RackedSeriesPoint:
      type: object
      required: [performedOn, topWeightLb, e1rmLb]
      properties:
        performedOn:
          type: string
          format: date
        topWeightLb:
          type: number
        e1rmLb:
          type: number
          description: Epley estimate, weightLb × (1 + reps / 30), rounded to the pound.

    RackedImprovement:
      type: object
      required: [exerciseId, exerciseName, fromLb, toLb, gainLb, gainPct]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        fromLb:
          type: number
        toLb:
          type: number
        gainLb:
          type: number
        gainPct:
          type: number
          description: Fraction, so 0.08 is +8%.

    RackedDayVolume:
      type: object
      required: [date, volumeLb, sessions]
      properties:
        date:
          type: string
          format: date
        volumeLb:
          type: number
        sessions:
          type: integer

    RackedStreak:
      type: object
      required: [longestWeeks, currentWeeks]
      properties:
        longestWeeks:
          type: integer
        currentWeeks:
          type: integer
          description: >
            Run of consecutive weeks ending at the last week trained within the
            period — measured in weeks because no program trains daily.

    RackedAttendance:
      type: object
      required: [basis, expected, actual, rate, sessionsPerWeek]
      properties:
        basis:
          type: string
          enum: [weekday, none]
          description: >
            Whether there is a real target to measure against. `weekday` means the
            program's days carry scheduled weekdays, so `expected` counts their
            real calendar occurrences and `rate` is meaningful. `none` means there
            is no schedule — either no current program, or a program whose days
            carry no weekday, which is the common case since programDay.weekday is
            nullable and no seed populates it. On `none`, `expected` and `rate` are
            zero and must not be displayed; show `sessionsPerWeek` instead.
        expected:
          type: integer
          description: Zero unless basis is `weekday`.
        actual:
          type: integer
        rate:
          type: number
          minimum: 0
          description: >
            actual ÷ expected, or 0 when there was no target. May exceed 1.
            Only meaningful when basis is `weekday`.
        sessionsPerWeek:
          type: number
          minimum: 0
          example: 2.8
          description: >
            How often the lifter actually trained, over the period's whole length
            rather than only the weeks they showed up. Always populated, needs no
            configuration, and is what to show when there is no target.

    RackedPR:
      type: object
      required: [kind, performedOn, exerciseId, exerciseName, weightLb, reps, valueLb, previousLb]
      properties:
        kind:
          type: string
          enum: [weight, e1rm]
          description: >
            `weight` is a heavier top set than the lift has ever seen. `e1rm` is
            the same bar carried for more reps — no new plate, but a higher
            estimated max, which on a 5x5 is what the session before a jump
            looks like. A weight record suppresses the e1rm record it implies.
        performedOn:
          type: string
          format: date
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        weightLb:
          type: number
        reps:
          type: integer
        valueLb:
          type: number
          description: The record itself — weight for `weight`, estimated max for `e1rm`.
        previousLb:
          type: number
          description: The mark it beat; 0 when the lift had no history.

    RackedMilestone:
      type: object
      required: [kind, performedOn, label, valueLb, exerciseId, exerciseName]
      properties:
        kind:
          type: string
          enum: [volume, plate]
        performedOn:
          type: string
          format: date
        label:
          type: string
          example: First 225 lb Bench Press
        valueLb:
          type: number
        exerciseId:
          type: integer
          format: int64
          description: Zero for a volume milestone, which belongs to no single lift.
        exerciseName:
          type: string

    RackedSetHighlight:
      type: object
      required: [performedOn, exerciseId, exerciseName, weightLb, reps]
      properties:
        performedOn:
          type: string
          format: date
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        weightLb:
          type: number
        reps:
          type: integer

    RackedSessionHighlight:
      type: object
      required: [sessionId, performedOn, programDayName, durationSeconds, volumeLb, sets]
      properties:
        sessionId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
        programDayName:
          type: string
        durationSeconds:
          type: integer
        volumeLb:
          type: number
        sets:
          type: integer

    RackedDeload:
      type: object
      required: [exerciseId, exerciseName, performedOn, fromLb, toLb, recovered, recoveredOn]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        performedOn:
          type: string
          format: date
        fromLb:
          type: number
        toLb:
          type: number
        recovered:
          type: boolean
        recoveredOn:
          type: string
          format: date
          nullable: true

    RackedArchetype:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: The Grinder
          description: Empty when the period holds no sessions to characterise.
        description:
          type: string
