openapi: 3.0.3
info:
  title: Iron Temple API
  version: 0.1.0
  description: >
    REST API for the Iron Temple weight-lifting tracker. All weights are in
    pounds (lb).

    Authentication is a session cookie (`it_session`), issued by
    `POST /auth/login` and revoked by `POST /auth/logout`. Every endpoint
    requires it except `/health`, the `/auth/*` endpoints, and avatar images.
    Registration is open only while no account exists: the first sign-up claims
    the install and closes the door behind it.

    Programs, days and exercises are shared — the prescription is the same for
    everyone. Sessions are per-user: what you lifted is yours, and progression
    is computed from your own history alone.

    Programs are made of days (e.g. Workout A / B); each day prescribes exercises
    with sets, reps, and a starting weight. A session is a performed instance of
    a day, with one logged set per prescribed set.

    Progression is linear and computed server-side from session history:
    +5 lb per session on squat, bench, row, and overhead press; +10 lb on
    deadlift; a 10% deload after three consecutive failed sessions on a lift.

servers:
  - url: /api/v1

# Applies to every operation; the handful of public ones override with
# `security: []`.
security:
  - cookieAuth: []

tags:
  - name: meta
  - name: auth
  - name: users
  - name: exercises
  - name: programs
  - name: sessions

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness/readiness probe
      # A Kubernetes probe cannot present a cookie.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/registration-status:
    get:
      tags: [auth]
      operationId: getRegistrationStatus
      summary: Whether an account can still be created
      description: >
        Lets the sign-in page decide between "sign in" and "create account".
        Public, because a signed-out visitor is exactly who needs the answer.
      security: []
      responses:
        "200":
          description: Registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create the first account and sign in
      description: >
        Succeeds only while no account exists; afterwards it returns 403.
        Sessions logged before any account existed are adopted by this user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              description: Session cookie (`it_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: >
                Session cookie (`it_session`). Without `rememberMe` it is a
                browser-session cookie; with it, `Max-Age` is 60 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out, revoking this session server-side
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update display name, avatar colour, or current program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: Change the password, revoking all other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in, or the current password was wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/baselines:
    get:
      tags: [users]
      operationId: listBaselines
      summary: Starting weights this lifter has overridden
      description: >
        Where each lift starts for this lifter, for the lifts they have said.
        A baseline displaces the program's seeded starting weight, and the seed
        is only consulted while a lift has no history at all — so a baseline
        decides a lift's first session and nothing after it. Lifts with no
        override are simply absent.
      responses:
        "200":
          description: Baselines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiftBaseline"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/baselines/{exerciseId}:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [users]
      operationId: setBaseline
      summary: Set where a lift starts for this lifter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBaselineRequest"
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [users]
      operationId: clearBaseline
      summary: Fall back to the program's seeded starting weight
      responses:
        "204":
          description: Cleared
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload an avatar image
      description: >
        Accepts a PNG or JPEG of at most 256 KB and 1024x1024 pixels. The image
        is decoded and re-encoded before storage, which drops EXIF metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: deleteAvatar
      summary: Remove the avatar, falling back to the initials chip
      responses:
        "204":
          description: Removed (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserAvatar
      summary: An avatar image
      description: >
        Public, because this is an `<img>` source and a browser cannot attach
        credentials to one. Responds with an ETag; honours `If-None-Match`.
      security: []
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified
        "404":
          $ref: "#/components/responses/NotFound"

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List the exercise library
      description: >
        The seeded catalogue plus the caller's own custom movements. Someone
        else's custom exercise is never returned.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [all, performed]
            default: all
          description: >
            all returns the whole library. performed narrows it to lifts the
            caller has actually logged, which is what the Progress page wants —
            a library's worth of untrained movements reading "no sessions yet"
            is noise.
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [exercises]
      operationId: createExercise
      summary: Add a custom exercise to the library
      description: >
        Creates a movement visible only to the caller. Names are compared
        case-insensitively against the shared catalogue and the caller's own
        exercises; a collision with either is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExerciseRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseId}:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [exercises]
      operationId: deleteExercise
      summary: Delete one of your own custom exercises
      description: >
        Seeded exercises cannot be deleted by anyone. A custom one cannot be
        deleted while it has logged sets against it — that would take a lift out
        of a finished session, which is a record — or while it is on a program
        day as assistance; remove it there first.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseId}/history:
    parameters:
      - name: exerciseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [exercises]
      operationId: getExerciseHistory
      summary: Per-session weight history for a lift (oldest first)
      responses:
        "200":
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseHistoryPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List available programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program with its days and prescribed exercises
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    patch:
      tags: [programs]
      operationId: updateProgramDayWeekday
      summary: Set or clear the weekday a program day is scheduled on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramDayRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}/assistance:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    post:
      tags: [programs]
      operationId: addAssistance
      summary: Attach an assistance exercise to a program day
      description: >
        Adds to the caller's own overlay on a shared program day; the program's
        prescription is not modified, and nobody else's view of the day changes.
        Takes effect on the next session started from this day — a session
        already in progress keeps the sets it was created with.


        Two 409s: the exercise is already on this day as assistance, or the
        program itself already prescribes it. The second is not a nicety —
        prescribing one lift twice collides on the session's own unique
        constraint, so the workout could not be started at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssistanceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDayAssistance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}/assistance/{assistanceId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
      - $ref: "#/components/parameters/AssistanceId"
    patch:
      tags: [programs]
      operationId: updateAssistance
      summary: Change an assistance exercise's sets, reps or fallback weight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssistanceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDayAssistance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [programs]
      operationId: removeAssistance
      summary: Remove an assistance exercise from a program day
      description: >
        Removes the plan, never the performance. Sets already logged against the
        exercise stay in the sessions that recorded them and keep counting toward
        volume and records.
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/days/{dayId}/next-session:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - $ref: "#/components/parameters/DayId"
    get:
      tags: [programs]
      operationId: previewNextSession
      summary: Preview the next session for a program day
      description: >
        Returns the prescription for the day with weights computed from history
        via the program's progression rules. Does not create a session.

        Also reports whether the lifter has been away from training long enough
        to be offered a deload (`layoff`), which is measured on every call —
        applying it is what `deload` below is for.
      parameters:
        - name: deload
          in: query
          required: false
          description: >-
            Apply the layoff deload to the weights in this preview: 10% off per
            full week since the lifter last trained, capped at 50%. Lets the UI
            show what easing back in would actually prescribe before the lifter
            commits to it. Has no effect when they have not been away a week.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Prescribed next session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescribedSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /racked:
    get:
      tags: [racked]
      operationId: getRacked
      summary: Statistics recap for one week, month or year
      description: >
        The Racked recap: headline volume, hero moments and the series behind
        each chart, for the week, calendar month or year containing `on`. The
        same report is rendered into the monthly and yearly recap email, so the
        two can never disagree.

        A week runs Monday to Sunday and is not clipped to a month or a year —
        the last week of March runs into April, and the week containing New
        Year's Day starts in the year before. Note that the email is monthly and
        yearly only: a weekly recap is a page a lifter opens, not something the
        server puts in their inbox 52 times a year.
      parameters:
        - name: period
          in: query
          required: false
          description: Granularity of the recap. Defaults to month.
          schema:
            type: string
            enum: [week, month, year]
            default: month
        - name: on
          in: query
          required: false
          description: >
            Any date inside the wanted period; the server expands it to the
            whole week, month or year. Defaults to today, so the recap opens on
            the period in progress.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RackedReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List performed sessions (most recent first)
      parameters:
        - name: programId
          in: query
          required: false
          description: Filter to sessions of a given program
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session from a program day
      description: >
        Materializes the day's prescription (with progression-computed weights)
        into a new session and its logged sets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session with its sets
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: Update session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Delete a session
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: finishSession
      summary: End a session
      description: >
        Stamps finishedAt and marks the session over, whether or not every set
        hit its target. Idempotent: finishing an already-finished session leaves
        the original timestamp in place. A session also becomes over on its own
        12 hours after it was started.
      responses:
        "200":
          description: The finished session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/sets:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: addSessionSet
      summary: Add one more set to a lift in this session
      description: >
        Appends a set to a lift already in the session, copying the rep target
        and weight from that lift's current last set. For the extra set, the
        AMRAP, the drop set — the day that did not go to plan in the direction of
        more work.


        Refused once the session is over: changing a closed session's shape can
        retroactively turn a successful lift into a failed one, since a lift
        succeeds only when every one of its sets was completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSessionSetRequest"
      responses:
        "201":
          description: The new set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such session, or that lift is not in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{sessionId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/SetId"
    delete:
      tags: [sessions]
      operationId: removeSessionSet
      summary: Remove a set from this session
      description: >
        Drops a set that was not performed. Removing a lift's last set takes the
        lift out of the session, which is what skipping it looks like.


        Set numbers are not renumbered afterwards — they order the sets, they do
        not name them — so a gap is expected and harmless.


        Refused once the session is over, for the same reason adding one is.
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [sessions]
      operationId: updateSessionSet
      summary: Log or amend a single set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionSetRequest"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: it_session
      description: >
        Opaque session token. Set by the server as an HttpOnly, SameSite=Lax
        cookie — it is never readable by, or set from, JavaScript, so clients
        neither send nor manage it explicitly.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DayId:
      name: dayId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AssistanceId:
      name: assistanceId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, or the session has expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request is valid but collides with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: Release version of the running API (ldflags at build).
          example: v0.1.0
        environment:
          type: string
          description: Deployment environment (development or production).
          example: production

    User:
      type: object
      required: [id, username, displayName, avatarColor, isAdmin, hasAvatar]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: ada
        displayName:
          type: string
          example: Ada Lovelace
        avatarColor:
          type: string
          description: >
            Hex colour for the initials chip. Empty means the UI derives one
            from the id.
          example: "#b026ff"
        isAdmin:
          type: boolean
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program the user last opened, which the app lands on instead of
            the picker. Absent until they open one; the UI then falls back to
            the program of their most recent session.
        hasAvatar:
          type: boolean
          description: Whether to render the image or the initials chip.
        avatarEtag:
          type: string
          description: >
            Append to the avatar URL as a cache-buster so a new upload shows
            immediately.
        barWeightLb:
          type: number
          minimum: 0
          description: >
            What this lifter's bar weighs. Every prescribed weight is loaded onto
            it, so the plate maths and the warm-up ramp are both wrong without
            it. 45 until the setup screen says otherwise.
          example: 80
        plates:
          type: array
          description: >
            The plates the lifter owns, heaviest first. Finite: the loader will
            not ask for a fifth pair of 45s when there are two, and rounds to the
            nearest weight this rack can actually build.
          items:
            $ref: "#/components/schemas/Plate"

    Plate:
      type: object
      required: [plateLb, pairs]
      properties:
        plateLb:
          type: number
          exclusiveMinimum: 0
          example: 45
        pairs:
          type: integer
          minimum: 1
          description: >
            How many *pairs* are owned, not how many plates. Plates load
            symmetrically, so three 45s are one usable pair.
          example: 2

    LiftBaseline:
      type: object
      required: [exerciseId, weightLb]
      properties:
        exerciseId:
          type: integer
          format: int64
        weightLb:
          type: number
          minimum: 0
          example: 95

    SetBaselineRequest:
      type: object
      required: [weightLb]
      properties:
        weightLb:
          type: number
          minimum: 0
          description: >
            0 is a legitimate baseline — an empty bar is where a press starts.
            Clearing an override is DELETE, not a weight.

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: True only while no account exists.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9._-]+$"
        displayName:
          type: string
          maxLength: 64
          description: Defaults to the username when omitted.
        password:
          type: string
          format: password
          minLength: 8
        rememberMe:
          type: boolean
          default: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: >
            Issues a 60-day cookie whose expiry slides forward as it is used,
            instead of one that dies with the browser session.

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatarColor:
          type: string
          description: Hex colour, or empty to fall back to the derived one.
          example: "#b026ff"
        currentProgramId:
          type: integer
          format: int64
          description: >
            The program to remember as the user's current one. Must name an
            existing program. There is no way to clear it back to unset — a
            program the user has opened is only forgotten when it is deleted.
        barWeightLb:
          type: number
          exclusiveMinimum: 0
          maximum: 200
        plates:
          type: array
          maxItems: 20
          description: >
            Replaces the inventory whole rather than patching one denomination:
            the client edits a rack, not a row, and a partial write would leave a
            plate the lifter deleted still loadable. An empty array is a lifter
            who owns no plates, and is honoured — every prescription then reads
            bar-only. Duplicate denominations are a 400.
          items:
            $ref: "#/components/schemas/Plate"

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    Avatar:
      type: object
      required: [etag]
      properties:
        etag:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          example: session 42 not found

    MuscleGroup:
      type: string
      enum: [chest, back, legs, shoulders, arms, core, other]

    Equipment:
      type: string
      enum: [barbell, dumbbell, machine, cable, bodyweight, other]

    Exercise:
      description: One movement in the library.
      type: object
      required: [id, name, muscleGroup, equipment, isAccessory, isCustom, topSet]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Squat
        muscleGroup:
          $ref: "#/components/schemas/MuscleGroup"
        equipment:
          $ref: "#/components/schemas/Equipment"
        isAccessory:
          type: boolean
          description: >-
            False for the compound lifts the seeded programs prescribe, true for
            accessory work. The library leans on this to lead with the movements
            a lifter is shopping for when adding assistance.
        isCustom:
          type: boolean
          description: >-
            True for a movement this lifter created. Only custom exercises can be
            deleted, and only by their owner; the seeded catalogue is shared.
        topSet:
          allOf:
            - $ref: "#/components/schemas/ExerciseTopSet"
          nullable: true
          description: >-
            The heaviest set this lifter has ever worked on this movement, or
            null if they never have. Present so the Progress page can render a
            card per lift from the list alone: it used to fetch every lift's
            entire history just to take the maximum, which was one request per
            card and a whole history transferred to compute one number.

    ExerciseTopSet:
      description: >
        A lift's all-time heaviest working set. Computed the same way the
        history endpoint computes a point — sets with actual_reps > 0, grouped
        by session, the session's top weight — then the heaviest of those, ties
        going to the earliest session, which is the one that originally set it.
      type: object
      required: [weightLb, performedOn]
      properties:
        weightLb:
          type: number
          minimum: 0
        performedOn:
          type: string
          format: date

    CreateExerciseRequest:
      type: object
      required: [name, muscleGroup, equipment]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Copenhagen Plank
        muscleGroup:
          $ref: "#/components/schemas/MuscleGroup"
        equipment:
          $ref: "#/components/schemas/Equipment"

    ExerciseHistoryPoint:
      description: One performed session's top set for a lift.
      type: object
      required: [performedOn, weightLb, reps, completed]
      properties:
        performedOn:
          type: string
          format: date
        weightLb:
          type: number
          minimum: 0
        reps:
          type: integer
        completed:
          type: boolean

    ProgressionKind:
      type: string
      enum: [linear, madcow]
      description: >
        linear advances a lift's single working weight every session and deloads
        after three failures. madcow ramps each session to a top set — 50, 62.5,
        75, 87.5, 100% — and advances that top set once a WEEK, on the one day
        whose ramp reaches 100%; every other day's weights are a percentage of
        it.

    ProgramSummary:
      type: object
      required: [id, name, description, progressionKind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: StrongLifts 5x5
        description:
          type: string
        progressionKind:
          $ref: "#/components/schemas/ProgressionKind"

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/ProgramDay"

    ProgramDay:
      type: object
      required: [id, name, position, weekday, exercises, assistance]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Workout A
        position:
          type: integer
          example: 1
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null if unscheduled.
        exercises:
          type: array
          description: >-
            The program's own prescription, shared by every lifter and never
            edited.
          items:
            $ref: "#/components/schemas/ProgramDayExercise"
        assistance:
          type: array
          description: >-
            The calling lifter's assistance work for this day — an additive
            overlay on the prescription above, private to them, and empty until
            they add something.
          items:
            $ref: "#/components/schemas/ProgramDayAssistance"

    ProgramDayAssistance:
      description: >-
        One assistance exercise a lifter has attached to a program day. Unlike
        ProgramDayExercise it has no starting weight and no progression: the
        prescribed weight is whatever they last logged for the lift, falling back
        to weightLb here.
      type: object
      required: [id, exerciseId, exerciseName, position, sets, reps, weightLb]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Dip
        position:
          type: integer
          example: 1
        sets:
          type: integer
          example: 3
        reps:
          type: integer
          example: 8
        weightLb:
          type: number
          minimum: 0
          description: Fallback weight, used until the lift has been logged once.
          example: 0
        repMin:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Bottom of the rep range. Given with repMax or not at all.
          example: 8
        repMax:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Top of the rep range. When every set reaches it, the weight goes up
            by 5 lb and the reps reset to repMin. There is no deload — a stalled
            accessory is not a signal.
          example: 12

    CreateAssistanceRequest:
      type: object
      required: [exerciseId, sets, reps]
      properties:
        exerciseId:
          type: integer
          format: int64
        sets:
          type: integer
          minimum: 1
          maximum: 20
          example: 3
        reps:
          type: integer
          minimum: 1
          maximum: 100
          example: 8
        weightLb:
          type: number
          minimum: 0
          default: 0
          description: Omit or send 0 for bodyweight work.
        repMin:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Bottom of the rep range. Given with repMax or not at all.
          example: 8
        repMax:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Top of the rep range. When every set reaches it, the weight goes up
            by 5 lb and the reps reset to repMin. There is no deload — a stalled
            accessory is not a signal.
          example: 12

    UpdateAssistanceRequest:
      description: >
        Any subset; omitted fields keep their current value. repMin and repMax
        are the exception: null on them is an instruction, not the same as
        omitting them — it turns the rep range off and puts the lift back on
        carrying its weight forward.
      type: object
      properties:
        sets:
          type: integer
          minimum: 1
          maximum: 20
        reps:
          type: integer
          minimum: 1
          maximum: 100
        weightLb:
          type: number
          minimum: 0
        repMin:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        repMax:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100

    UpdateProgramDayRequest:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday; null to unschedule.

    ProgramDayExercise:
      type: object
      required:
        [id, exerciseId, exerciseName, position, sets, reps, startingWeightLb, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        position:
          type: integer
          example: 1
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        startingWeightLb:
          type: number
          minimum: 0
          example: 45
        restSeconds:
          type: integer
          description: >-
            Prescribed rest between sets, in seconds. A property of the movement
            rather than of the day it was prescribed on, so the same lift rests
            the same wherever it appears: five minutes for the squat and deadlift
            families, three for the other compounds, ninety seconds for isolation
            work. A custom exercise inherits the three-minute default.
          example: 300

    PrescribedSession:
      description: A day's prescription with progression-computed weights, not yet saved.
      type: object
      required: [programId, programDayId, programDayName, exercises, layoff]
      properties:
        programId:
          type: integer
          format: int64
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExercise"
        layoff:
          allOf:
            - $ref: "#/components/schemas/Layoff"
          nullable: true
          description: >-
            Null unless the lifter has been away from training for a week or
            more, so its presence is the cue to ask whether they want to ease
            back in. Present whether or not the deload was applied — the weights
            above already reflect the answer, and this says what the question
            was.

    Layoff:
      description: >-
        Time away from training, and what easing back in would cost. Lets a
        client ask a specific question ("it's been 3 weeks — take 30% off?")
        rather than a vague one.
      type: object
      required: [weeks, lastTrainedOn, deloadPct, applied]
      properties:
        weeks:
          type: integer
          minimum: 1
          description: >-
            Full weeks since the last session with a logged rep, floored — six
            days off is not a layoff and seven is.
          example: 3
        lastTrainedOn:
          type: string
          format: date
          description: The day of that session.
        deloadPct:
          type: number
          minimum: 0
          maximum: 0.5
          description: >-
            What accepting the deload would take off, as a fraction (0.3 is
            30%): 10% per full week away, capped at 50%.
          example: 0.3
        applied:
          type: boolean
          description: >-
            Whether the weights in this response have the cut in them. False by
            default — a layoff deload is offered, never imposed.

    ExerciseKind:
      type: string
      enum: [main, assistance]
      description: >-
        main is the program's own prescription, driven by the progression engine.
        assistance is the lifter's own addition to the day, whose weight carries
        forward from what they last logged.

    PrescribedExercise:
      type: object
      required: [exerciseId, exerciseName, kind, sets, reps, weightLb, restSeconds, progression]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        kind:
          $ref: "#/components/schemas/ExerciseKind"
        sets:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        weightLb:
          type: number
          minimum: 0
          description: Computed target weight for this session
          example: 50
        restSeconds:
          type: integer
          description: >-
            Prescribed rest between sets, in seconds — see ProgramDayExercise.
          example: 300
        repMin:
          type: integer
          description: >-
            Bottom of an assistance lift's rep range, when it has one. `reps`
            above is this same number: a set is complete at the bottom of the
            range and the weight moves at the top, which is what keeps
            "finished the session" and "earned the increase" apart. Absent on
            main lifts and on assistance with no range.
          example: 8
        repMax:
          type: integer
          description: Top of that range — reaching it on every set is what advances the weight.
          example: 12
        setPlan:
          type: array
          description: >
            Every set this lift prescribes today, each with its own reps and its
            own weight. Always present, for every program: a lift whose sets
            share one weight emits a flat plan rather than nothing, so a client
            has one shape to render instead of two.


            `sets` above is its length and `weightLb` is the top set — the number
            that moves week to week, and the one to show beside the lift's name.
          items:
            $ref: "#/components/schemas/PrescribedSet"
        progression:
          $ref: "#/components/schemas/ProgressionInfo"

    PrescribedSet:
      description: >
        One set of a prescription. Ramping programs give each set its own weight
        and reps — Madcow climbs to a top set, and its intensity day finishes
        with a triple above that and a backoff below it.
      type: object
      required: [setNumber, reps, weightLb]
      properties:
        setNumber:
          type: integer
          example: 5
        reps:
          type: integer
          example: 5
        weightLb:
          type: number
          minimum: 0
          example: 185

    ProgressionInfo:
      description: >-
        Why the engine chose this lift's weight, so the UI can surface an
        impending stall or a deload instead of a bare number.
      type: object
      required: [status, failureCount, failuresBeforeDeload, previousWeightLb, layoffPct]
      properties:
        status:
          type: string
          enum: [start, advance, hold, deload, layoff, fixed, progressing]
          description: >-
            start (no history), advance (last session passed), hold (recent
            failure, repeating the weight), deload (stall hit the threshold, weight
            dropped), layoff (weight cut for time away from training rather than
            for anything that happened in a session), fixed (the weight was
            carried forward from what was last logged, rather than computed —
            assistance work with no rep range), progressing (an assistance lift
            with a rep range topped it out on every set, so the weight went up
            and the reps reset to the bottom).
          example: hold
        failureCount:
          type: integer
          minimum: 0
          description: Consecutive failed sessions at the current working weight.
          example: 2
        failuresBeforeDeload:
          type: integer
          minimum: 1
          description: Failures at a weight that trigger a deload.
          example: 3
        previousWeightLb:
          type: number
          minimum: 0
          description: >-
            The weight just worked — advanced past, repeated, or deloaded from;
            0 when there is no history.
          example: 185
        layoffPct:
          type: number
          minimum: 0
          maximum: 0.5
          description: >-
            The fraction taken off this lift for time away from training (0.3 is
            30%), 0 when none was. Per-lift as well as on the session, because a
            layoff does not necessarily reach every lift: one already deloaded
            further for a stall keeps its own, deeper cut.
          example: 0

    CreateSessionRequest:
      type: object
      required: [programDayId]
      properties:
        programDayId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
          description: Defaults to the server's current date if omitted
        deload:
          type: boolean
          default: false
          description: >-
            Bake the layoff deload into this session's weights — the lifter's
            yes to the prompt `PrescribedSession.layoff` raised. How deep the cut
            goes is not sent: the server measures the layoff itself when the
            session is created, so this cannot ask for an arbitrary weight. Has
            no effect when they have not been away a week.

    UpdateSessionRequest:
      type: object
      description: Any subset of fields may be provided.
      properties:
        performedOn:
          type: string
          format: date
        notes:
          type: string
        bodyweightLb:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          description: >
            What the lifter weighed on the day. Omit the field to leave an
            existing weigh-in alone; send null to erase one. Zero and negatives
            are rejected — a weigh-in of nothing is a typo, not a measurement.

    AddSessionSetRequest:
      type: object
      required: [exerciseId]
      properties:
        exerciseId:
          type: integer
          format: int64
          description: >
            The lift to add a set to. Must already be in the session — this adds
            a set, not an exercise.

    UpdateSessionSetRequest:
      type: object
      description: Any subset of fields may be provided.
      properties:
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Reps actually completed; null clears a prior entry
        weightLb:
          type: number
          minimum: 0
          description: Override the target weight actually lifted
        completed:
          type: boolean

    Session:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, notes, createdAt, isOver, sets]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
          example: Workout A
        performedOn:
          type: string
          format: date
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the lifter pressed Finish. Null if they never did — the session
            may still be over, having aged past the 12-hour cutoff.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago. An over session is read-only and is what the
            progression engine counts.
        bodyweightLb:
          type: number
          nullable: true
          description: >
            What the lifter weighed on the day of this session. Null means they
            did not step on a scale, which is a distinct answer from any number —
            a weight-loss series is the days that were measured.
        lastWeighIn:
          # Wrapped in allOf because a sibling of $ref is ignored in OpenAPI 3.0,
          # and this field needs both nullable and a description of its own.
          allOf:
            - $ref: "#/components/schemas/WeighIn"
          nullable: true
          description: >
            The lifter's most recent weigh-in from a *different* session, so a new
            session's box can open pre-filled rather than empty. Null until they
            have recorded one. Carrying it here rather than writing it onto the
            new session is what keeps an un-weighed day null.
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SessionSet"

    WeighIn:
      description: A recorded bodyweight and the day it was recorded.
      type: object
      required: [weightLb, performedOn]
      properties:
        weightLb:
          type: number
          example: 184.5
        performedOn:
          type: string
          format: date

    SessionSet:
      type: object
      required:
        [id, exerciseId, exerciseName, kind, setNumber, targetReps, weightLb, completed, restSeconds]
      properties:
        id:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
          example: Squat
        kind:
          $ref: "#/components/schemas/ExerciseKind"
        setNumber:
          type: integer
          example: 1
        targetReps:
          type: integer
          example: 5
        actualReps:
          type: integer
          nullable: true
          minimum: 0
          description: Null until the set is logged
        weightLb:
          type: number
          minimum: 0
          example: 50
        completed:
          type: boolean
        restSeconds:
          type: integer
          description: >-
            Prescribed rest after this set, in seconds — see ProgramDayExercise.
            The session screen's countdown starts from it, so a set of deadlifts
            and a set of curls no longer ask for the same three minutes.
          example: 300

    SessionExerciseWeight:
      description: An exercise's set/rep prescription and top weight for a session.
      type: object
      required: [exerciseName, sets, reps, weightLb]
      properties:
        exerciseName:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        weightLb:
          type: number
          minimum: 0

    SessionSummary:
      type: object
      required:
        [id, programId, programName, programDayId, programDayName, performedOn, setCount, completedSetCount, volumeLb, isOver, exercises]
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        programDayId:
          type: integer
          format: int64
        programDayName:
          type: string
        performedOn:
          type: string
          format: date
        setCount:
          type: integer
        completedSetCount:
          type: integer
        volumeLb:
          type: number
          minimum: 0
          example: 8450
          description: >
            Total weight moved in this session — the sum of actualReps × weightLb
            over every set with reps logged. A set logged short of its target
            still counts what was lifted, so this does not track completedSetCount.
        isOver:
          type: boolean
          description: >
            True once the session was finished by hand or was started more than
            12 hours ago.
        exercises:
          type: array
          description: Per-exercise top weights, in prescription order.
          items:
            $ref: "#/components/schemas/SessionExerciseWeight"

    SessionList:
      type: object
      required: [items, total, totalVolumeLb, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        total:
          type: integer
        totalVolumeLb:
          type: number
          minimum: 0
          example: 412650
          description: >
            Volume summed over every session matching the filter, not just the
            ones on this page — a lifetime total that does not change as the
            caller pages through the history.
        limit:
          type: integer
        offset:
          type: integer

    # ---- Racked ----
    # The recap. Every statistic is computed server-side so that the page and
    # the monthly email render the same numbers from the same report; nothing
    # here is aggregated again on the client.

    RackedReport:
      type: object
      required:
        [period, totals, change, comparison, split, muscles, lifts, series, mostImproved,
         bodyweight, days, weekdays, bestWeekday, hours, peakHour, hourLabel, streak, attendance,
         prs, milestones, heaviestSet, fastestSession, deloads, archetype]
      properties:
        period:
          $ref: "#/components/schemas/RackedPeriod"
        totals:
          $ref: "#/components/schemas/RackedTotals"
        change:
          allOf:
            - $ref: "#/components/schemas/RackedChange"
          nullable: true
          description: >
            Movement against the preceding period, or null when that period
            holds no sessions to compare against.
        comparison:
          $ref: "#/components/schemas/RackedComparison"
        split:
          $ref: "#/components/schemas/RackedSplit"
        muscles:
          type: array
          description: >
            Volume split by the muscle group each movement trains, heaviest
            first — and unlike `lifts`, EVERY group in the taxonomy is present,
            including the ones with nothing logged against them. That is the
            point of the section: a lifter who trained no core all month sees
            nothing about it in a ranking of what they did train.

            A period that logged no work at all sends `null` here rather than
            seven empty groups — there is no body to account for, and the
            surfaces drop the section instead of reporting seven failures to
            train. Same convention as `lifts` and `series`; read it as
            `muscles ?? []`.
          items:
            $ref: "#/components/schemas/RackedMuscleSlice"
        lifts:
          type: array
          description: Volume split by lift, heaviest first.
          items:
            $ref: "#/components/schemas/RackedLiftSlice"
        series:
          type: array
          description: One estimated-max progression per lift, oldest point first.
          items:
            $ref: "#/components/schemas/RackedSeries"
        mostImproved:
          allOf:
            - $ref: "#/components/schemas/RackedImprovement"
          nullable: true
          description: Null until a lift has been performed twice in the period.
        bodyweight:
          allOf:
            - $ref: "#/components/schemas/RackedBodyweight"
          nullable: true
          description: >
            The period's weigh-ins, or null when it holds none — which is the
            common case, since recording a bodyweight is optional on every
            session. Surfaces drop the section entirely rather than render a
            lifter who weighs nothing.
        days:
          type: array
          description: Per-day tonnage for the calendar heatmap, oldest first.
          items:
            $ref: "#/components/schemas/RackedDayVolume"
        weekdays:
          type: array
          description: Volume by weekday, indexed 0 = Sunday to match programDay.weekday.
          minItems: 7
          maxItems: 7
          items:
            type: number
        bestWeekday:
          type: integer
          minimum: -1
          maximum: 6
          description: Weekday with the most volume, or -1 when nothing was lifted.
        hours:
          type: array
          description: Session start counts by hour of day in the server's report zone.
          minItems: 24
          maxItems: 24
          items:
            type: integer
        peakHour:
          type: integer
          minimum: -1
          maximum: 23
          description: >
            The hour `hourLabel` describes — the earliest hour holding the most
            session starts — or -1 when no session carries a start time. Read
            this rather than scanning `hours`, so the bar a surface accents is
            the one the label is talking about.
        hourLabel:
          type: string
          example: Early bird
          description: Empty when there are no sessions to characterise.
        streak:
          $ref: "#/components/schemas/RackedStreak"
        attendance:
          $ref: "#/components/schemas/RackedAttendance"
        prs:
          type: array
          items:
            $ref: "#/components/schemas/RackedPR"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/RackedMilestone"
        heaviestSet:
          allOf:
            - $ref: "#/components/schemas/RackedSetHighlight"
          nullable: true
        fastestSession:
          allOf:
            - $ref: "#/components/schemas/RackedSessionHighlight"
          nullable: true
          description: >
            Null when no session in the period was finished by hand — an
            unfinished session has no duration worth reporting.
        deloads:
          type: array
          items:
            $ref: "#/components/schemas/RackedDeload"
        archetype:
          $ref: "#/components/schemas/RackedArchetype"

    RackedPeriod:
      type: object
      required: [kind, start, end, label, inProgress]
      properties:
        kind:
          type: string
          enum: [week, month, year]
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: Inclusive last day of the period.
        label:
          type: string
          description: >
            The period as a person would name it: "2026", "March 2026", or for a
            week the days it covers — "March 16–22 2026", widening to
            "March 30 – April 5 2026" or "December 29 2025 – January 4 2026"
            where the week straddles a boundary. Weeks are not numbered; nobody
            counts in them.
          example: March 2026
        inProgress:
          type: boolean
          description: >
            Whether the period is still running. Every rate in the report is
            then measured over the days that have elapsed rather than the
            period's whole length, and `change` compares the same stretch of
            the preceding period — so a month three days old is not weighed
            against a month that ran its full length.

    RackedTotals:
      type: object
      required: [volumeLb, sessions, sets, reps]
      properties:
        volumeLb:
          type: number
          minimum: 0
          description: Same formula as SessionSummary.volumeLb — actualReps × weightLb.
        sessions:
          type: integer
        sets:
          type: integer
        reps:
          type: integer

    RackedChange:
      type: object
      required: [volumeLb, volumePct, sessions, sessionsPct]
      properties:
        volumeLb:
          type: number
          description: Signed difference against the preceding period.
        volumePct:
          type: number
          nullable: true
          description: >
            Fraction, so 0.12 is +12%. Null when the preceding period moved no
            weight, because growth from zero is not a ratio.
        sessions:
          type: integer
        sessionsPct:
          type: number
          nullable: true

    RackedComparison:
      type: object
      required: [count, label, unitLb]
      properties:
        count:
          type: integer
          minimum: 0
          description: Zero when the volume is too small for even the lightest object.
        label:
          type: string
          example: school buses
          description: Already pluralised to agree with count.
        unitLb:
          type: number

    RackedSplit:
      type: object
      required: [main, assistance]
      description: >
        The period's volume divided between the work the program prescribed and
        the assistance the lifter added to it. It divides rather than subtracts:
        main.volumeLb + assistance.volumeLb equals totals.volumeLb, and the two
        shares sum to 1. The recap counted assistance in its headline from the
        day assistance shipped; this only names which is which.
      properties:
        main:
          $ref: "#/components/schemas/RackedWork"
        assistance:
          $ref: "#/components/schemas/RackedWork"

    RackedWork:
      type: object
      required: [volumeLb, sets, reps, lifts, share]
      properties:
        volumeLb:
          type: number
        sets:
          type: integer
        reps:
          type: integer
        lifts:
          type: integer
          description: >
            Distinct exercises this class covered — eighteen percent of a month
            across one movement and across eight are different months.
        share:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the period's whole volume, not of its own class.

    RackedBodyweight:
      type: object
      required: [points, startLb, endLb, lowLb, highLb, changeLb, changePct]
      properties:
        points:
          type: array
          description: >
            The weigh-ins themselves, oldest first, one per session that recorded
            one. Days without a weigh-in are absent rather than interpolated — a
            reading exists only where somebody stood on a scale.
          items:
            $ref: "#/components/schemas/RackedWeighIn"
        startLb:
          type: number
          description: >
            The first reading in the period, which is not the same as the
            lifter's weight on its first day.
        endLb:
          type: number
        lowLb:
          type: number
        highLb:
          type: number
        changeLb:
          type: number
          nullable: true
          description: >
            endLb minus startLb, or null when the period holds a single weigh-in
            — one reading is a fact, not a trend, and zero would claim a
            stability nobody measured.
        changePct:
          type: number
          nullable: true
          description: Fraction, not percent — -0.014 is -1.4%. Null with changeLb.

    RackedWeighIn:
      type: object
      required: [performedOn, weightLb]
      properties:
        performedOn:
          type: string
          format: date
        weightLb:
          type: number

    RackedMuscleSlice:
      type: object
      required: [group, volumeLb, sets, reps, lifts, share, trained]
      description: >
        One muscle group's share of the period. A movement has exactly one
        group — its primary mover, as recorded in the exercise library — so
        nothing is double-counted and the slices sum to totals.volumeLb. The
        corollary is that a bench press is credited to the chest alone; the
        triceps and front delts it also trains are credited nowhere. That is
        coarse on purpose: contribution weights per exercise are not something
        the library holds or that anyone would maintain by hand, and the coarse
        answer still tells a lifter whether a region of the body went untouched.
      properties:
        group:
          $ref: "#/components/schemas/MuscleGroup"
        volumeLb:
          type: number
        sets:
          type: integer
        reps:
          type: integer
        lifts:
          type: integer
          description: >
            Distinct movements the group covered — a third of a month all of it
            squats and a third across five leg movements are different months.
        share:
          type: number
          minimum: 0
          maximum: 1
        trained:
          type: boolean
          description: >
            False for a group with nothing logged against it. Equivalent to
            `sets == 0`, and named because it is what the surfaces branch on: an
            untrained group is a different kind of row, not a short bar.

    RackedLiftSlice:
      type: object
      required: [exerciseId, exerciseName, volumeLb, sets, reps, share, isAssistance]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        volumeLb:
          type: number
        sets:
          type: integer
        reps:
          type: integer
        share:
          type: number
          minimum: 0
          maximum: 1
        isAssistance:
          type: boolean
          description: >
            True when every set of this lift in the period was assistance work.
            Every, not most: a lift can be prescribed on one program day and
            bolted onto another, and one prescribed set makes it the program's
            work. Use `split` for figures that have to add up — this only decides
            what a lift is called in a list.

    RackedSeries:
      type: object
      required: [exerciseId, exerciseName, points, isAssistance]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        isAssistance:
          type: boolean
          description: As on RackedLiftSlice.
        points:
          type: array
          items:
            $ref: "#/components/schemas/RackedSeriesPoint"

    RackedSeriesPoint:
      type: object
      required: [performedOn, topWeightLb, e1rmLb]
      properties:
        performedOn:
          type: string
          format: date
        topWeightLb:
          type: number
        e1rmLb:
          type: number
          description: Epley estimate, weightLb × (1 + reps / 30), rounded to the pound.

    RackedImprovement:
      type: object
      required: [exerciseId, exerciseName, fromLb, toLb, gainLb, gainPct]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        fromLb:
          type: number
        toLb:
          type: number
        gainLb:
          type: number
        gainPct:
          type: number
          description: Fraction, so 0.08 is +8%.

    RackedDayVolume:
      type: object
      required: [date, volumeLb, sessions]
      properties:
        date:
          type: string
          format: date
        volumeLb:
          type: number
        sessions:
          type: integer

    RackedStreak:
      type: object
      required: [longestWeeks, currentWeeks]
      properties:
        longestWeeks:
          type: integer
        currentWeeks:
          type: integer
          description: >
            Run of consecutive weeks ending at the last week trained within the
            period — measured in weeks because no program trains daily.

    RackedAttendance:
      type: object
      required: [basis, expected, actual, rate, sessionsPerWeek]
      properties:
        basis:
          type: string
          enum: [weekday, none]
          description: >
            Whether there is a real target to measure against. `weekday` means the
            program's days carry scheduled weekdays, so `expected` counts their
            real calendar occurrences and `rate` is meaningful. `none` means there
            is no schedule — either no current program, or a program whose days
            carry no weekday, which is the common case since programDay.weekday is
            nullable and no seed populates it. On `none`, `expected` and `rate` are
            zero and must not be displayed; show `sessionsPerWeek` instead.
        expected:
          type: integer
          description: Zero unless basis is `weekday`.
        actual:
          type: integer
        rate:
          type: number
          minimum: 0
          description: >
            actual ÷ expected, or 0 when there was no target. May exceed 1.
            Only meaningful when basis is `weekday`.
        sessionsPerWeek:
          type: number
          minimum: 0
          example: 2.8
          description: >
            How often the lifter actually trained, over the period's whole length
            rather than only the weeks they showed up. Always populated, needs no
            configuration, and is what to show when there is no target.

    RackedPR:
      type: object
      required: [kind, performedOn, exerciseId, exerciseName, weightLb, reps, valueLb, previousLb]
      properties:
        kind:
          type: string
          enum: [weight, e1rm]
          description: >
            `weight` is a heavier top set than the lift has ever seen. `e1rm` is
            the same bar carried for more reps — no new plate, but a higher
            estimated max, which on a 5x5 is what the session before a jump
            looks like. A weight record suppresses the e1rm record it implies.
        performedOn:
          type: string
          format: date
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        weightLb:
          type: number
        reps:
          type: integer
        valueLb:
          type: number
          description: The record itself — weight for `weight`, estimated max for `e1rm`.
        previousLb:
          type: number
          description: The mark it beat; 0 when the lift had no history.

    RackedMilestone:
      type: object
      required: [kind, performedOn, label, valueLb, exerciseId, exerciseName]
      properties:
        kind:
          type: string
          enum: [volume, plate]
        performedOn:
          type: string
          format: date
        label:
          type: string
          example: First 225 lb Bench Press
        valueLb:
          type: number
        exerciseId:
          type: integer
          format: int64
          description: Zero for a volume milestone, which belongs to no single lift.
        exerciseName:
          type: string

    RackedSetHighlight:
      type: object
      required: [performedOn, exerciseId, exerciseName, weightLb, reps]
      properties:
        performedOn:
          type: string
          format: date
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        weightLb:
          type: number
        reps:
          type: integer

    RackedSessionHighlight:
      type: object
      required: [sessionId, performedOn, programDayName, durationSeconds, volumeLb, sets]
      properties:
        sessionId:
          type: integer
          format: int64
        performedOn:
          type: string
          format: date
        programDayName:
          type: string
        durationSeconds:
          type: integer
        volumeLb:
          type: number
        sets:
          type: integer

    RackedDeload:
      type: object
      required: [exerciseId, exerciseName, performedOn, fromLb, toLb, recovered, recoveredOn]
      properties:
        exerciseId:
          type: integer
          format: int64
        exerciseName:
          type: string
        performedOn:
          type: string
          format: date
        fromLb:
          type: number
        toLb:
          type: number
        recovered:
          type: boolean
        recoveredOn:
          type: string
          format: date
          nullable: true

    RackedArchetype:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: The Grinder
          description: Empty when the period holds no sessions to characterise.
        description:
          type: string
