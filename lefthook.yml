# Git hooks for the iron-temple monorepo, run via lefthook.
#
#   Install the binary: https://github.com/evilmartians/lefthook
#   Enable the hooks:   lefthook install
#
# (In the devcontainer sandbox both are done for you — the image bakes lefthook and
# hl-devcontainer.sh runs `lefthook install` per session.)
#
# ONE command per hook on purpose. The gate logic — which checks are relevant, and
# in what order — lives in dev/precommit.sh and dev/prepush.sh, which both delegate
# to scripts/preflight.sh. That keeps a single definition of "the gates" shared by
# the hooks and by a manual `scripts/preflight.sh` run, and keeps this file free of
# globs subtle enough to fail silently.
#
# THE SPLIT between the two hooks is about how often the same work is worth doing.
# The gates check the working tree, not a commit, so a stack of commits built from
# one tree used to run the identical suite once per commit. Cheap repo-wide checks
# stay on commit (gitleaks especially — a secret has to be caught before it enters
# history); the build and test gates run once, on push, which is the moment the
# tree actually reaches CI. Each script's header has the full reasoning.
#
# What runs, and what CI keeps to itself, is documented at the top of preflight.sh.
# Two gates are deliberately NOT here because they cannot work air-gapped:
# `go mod tidy` (dead Go proxy) and `govulncheck` (fetches vuln.go.dev) — both were
# measured failing, and CI enforces them.

pre-commit:
  parallel: false
  commands:
    gates:
      run: sh dev/precommit.sh

pre-push:
  # Sequential, and the guard is named first: there is no point spending minutes on
  # the suites for a push that is about to be refused.
  parallel: false
  commands:
    1-no-orphan-branch:
      # Block pushing a branch whose remote was deleted (e.g. after its PR merged) —
      # re-pushing would silently re-create it as an orphan. See dev/pre-push-guard.sh.
      run: sh dev/pre-push-guard.sh
    2-gates:
      # The build and test gates, scoped to what this branch changes vs main.
      run: sh dev/prepush.sh

# Keep the git-ignored hey-api client in step with src/api/openapi.yaml whenever the
# working tree moves, so the editor's language server doesn't lint against a stale
# contract. The npm scripts already chain generate:api for command-line entry points;
# these hooks are what reach the editor. All three matter: `git pull` fires post-merge,
# `git pull --rebase` fires post-rewrite, and branch switches plus `git worktree add`
# fire post-checkout. Non-blocking by design — see dev/regen-api.sh.
post-merge:
  commands:
    regen-api:
      run: sh dev/regen-api.sh

post-checkout:
  commands:
    regen-api:
      run: sh dev/regen-api.sh

post-rewrite:
  commands:
    regen-api:
      run: sh dev/regen-api.sh
