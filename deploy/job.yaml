apiVersion: batch/v1
kind: Job
metadata:
  name: iron-temple-bootstrap
  labels:
    app.kubernetes.io/name: iron-temple
    app.kubernetes.io/component: db-bootstrap
spec:
  backoffLimit: 3
  # Completed Jobs are immutable. To re-run after editing bootstrap.sql:
  #   kubectl delete job iron-temple-bootstrap && kubectl apply -k deploy/
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iron-temple
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:17
          command: ["psql", "--no-psqlrc", "-f", "/sql/bootstrap.sql"]
          env:
            # --- Shared instance connection (EDIT host/port for your cluster) ---
            - name: PGHOST
              value: postgres.databases.svc.cluster.local # <-- EDIT
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: postgres # maintenance DB; where CREATE ROLE/DATABASE run
            # --- Admin credentials: existing superuser Secret (EDIT names) ---
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin # <-- EDIT: your instance admin Secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin # <-- EDIT
                  key: password
            # --- Tenant password: shared with the app's DATABASE_URL Secret ---
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iron-temple-db
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: iron-temple-bootstrap # generated by kustomization.yaml
