apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EDIT: the namespace your shared Postgres and app live in.
namespace: databases

resources:
  - job.yaml
  # The nightly pg_dump and the volume it writes to. Independent of the
  # bootstrap Job above — that one runs once to provision, this one runs
  # forever — but it belongs to the same tenant, in the same namespace, holding
  # the same Secret, so it is applied by the same overlay.
  - backup.yaml

# Builds the ConfigMap from bootstrap.sql and rewrites the Job's volume
# reference to the hashed name automatically, so an edited SQL file produces
# a new ConfigMap (and thus a real re-provision when you re-run the Job).
configMapGenerator:
  - name: iron-temple-bootstrap
    files:
      - bootstrap.sql
